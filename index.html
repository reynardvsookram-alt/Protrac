/* ============ v2: EXCEL / PASTE IMPORT ============ */
async function inflateRaw(u8){const ds=new DecompressionStream("deflate-raw");const s=new Blob([u8]).stream().pipeThrough(ds);return new Uint8Array(await new Response(s).arrayBuffer());}
function unzip(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error("Not an .xlsx file");
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    out[name]={method,data:u.subarray(ds,ds+csize)};p+=46+nl+xl+cl;
  }
  return out;
}
async function zipText(z,name){const f=z[name];if(!f)return null;return new TextDecoder().decode(f.method===0?f.data:await inflateRaw(f.data));}
function colIdx(ref){const m=/^([A-Z]+)/.exec(ref||"");if(!m)return -1;let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1;}
function excelDate(n){return new Date(Date.UTC(1899,11,30)+Math.round(n)*86400000).toISOString().slice(0,10);}
function byTag(el,t){const a=el.getElementsByTagName(t);return a.length?a:el.getElementsByTagNameNS("*",t);}
async function readXlsx(buf){
  const z=unzip(buf),P=s=>new DOMParser().parseFromString(s,"application/xml");
  const wb=P(await zipText(z,"xl/workbook.xml")),rels=P(await zipText(z,"xl/_rels/workbook.xml.rels")||"<r/>");
  const relMap={};for(const r of byTag(rels,"Relationship"))relMap[r.getAttribute("Id")]=r.getAttribute("Target");
  const ss=[],ssx=await zipText(z,"xl/sharedStrings.xml");
  if(ssx)for(const si of byTag(P(ssx),"si")){let t="";for(const tt of byTag(si,"t"))t+=tt.textContent;ss.push(t);}
  const dates=new Set(),stx=await zipText(z,"xl/styles.xml");
  if(stx){const sd=P(stx),custom={};for(const nf of byTag(sd,"numFmt"))custom[nf.getAttribute("numFmtId")]=nf.getAttribute("formatCode")||"";
    const cx=byTag(sd,"cellXfs")[0];if(cx){let i=0;for(const xf of byTag(cx,"xf")){const id=+xf.getAttribute("numFmtId");const code=(custom[id]||"").replace(/"[^"]*"|\[[^\]]*\]/g,"");if((id>=14&&id<=22)||(id>=45&&id<=47)||(id>=164&&/[dy]/i.test(code)&&!/0\.0/.test(code)))dates.add(i);i++;}}}
  const sheets=[];
  for(const s of byTag(wb,"sheet")){
    let rid=s.getAttribute("r:id");if(!rid)for(const a of s.attributes)if(a.localName==="id")rid=a.value;
    let tg=relMap[rid]||"";tg=tg.replace(/^\/?xl\//,"").replace(/^\//,"");
    const x=await zipText(z,"xl/"+tg);if(!x)continue;
    const rows=[];let rr=0;
    for(const r of byTag(P(x),"row")){
      const ri=r.getAttribute("r")?(+r.getAttribute("r"))-1:rr;rr=ri+1;const row=[];let cc=0;
      for(const c of byTag(r,"c")){
        let ci=colIdx(c.getAttribute("r"));if(ci<0)ci=cc;cc=ci+1;
        const t=c.getAttribute("t"),si=+c.getAttribute("s"),v=byTag(c,"v")[0];let val="";
        if(t==="s")val=v?(ss[+v.textContent]||""):"";
        else if(t==="inlineStr")val=Array.from(byTag(c,"t")).map(e=>e.textContent).join("");
        else if(t==="b")val=v&&v.textContent==="1"?"TRUE":"FALSE";
        else if(v){const raw=v.textContent;if(t==="str"||t==="e")val=raw;else{const num=+raw;val=(dates.has(si)&&num>20000&&num<80000)?excelDate(num):(isNaN(num)?raw:String(Math.round(num*1e6)/1e6));}}
        row[ci]=val;
      }
      rows[ri]=Array.from(row,v=>v==null?"":v);
    }
    sheets.push({name:s.getAttribute("name")||"Sheet",rows:Array.from(rows,r=>r||[])});
  }
  return sheets;
}
function parseDelim(text,d){
  const rows=[];let i=0,f="",row=[],q=false;text=text.replace(/\r\n?/g,"\n");
  while(i<text.length){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i+=2;continue;}q=false;i++;continue;}f+=ch;i++;continue;}
    if(ch==='"'&&f===""){q=true;i++;continue;}
    if(ch===d){row.push(f);f="";i++;continue;}
    if(ch==="\n"){row.push(f);rows.push(row);row=[];f="";i++;continue;}
    f+=ch;i++;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}

function normHead(s){return (s||"").toString().toLowerCase().replace(/\(.*?\)/g," ").replace(/[^a-z0-9#/ ]+/g," ").replace(/\s+/g," ").trim();}
function detectHeader(rows,tg){
  let best={row:-1,score:0};
  for(let r=0;r<Math.min(rows.length,25);r++){
    const cells=(rows[r]||[]).map(normHead);let sc=0;
    cells.forEach(c=>{if(c&&tg.fields.some(f=>f[2].includes(c)||f[2].some(s=>s.length>3&&c.startsWith(s))))sc++;});
    if(sc>best.score)best={row:r,score:sc};
  }
  return best.score>=2?best.row:-1;
}
function autoMap(rows,hr,tg){
  const head=hr>=0?(rows[hr]||[]).map(normHead):[];
  const data=rows.slice(hr+1).filter(r=>r&&r.some(v=>(v||"").toString().trim()));
  const map={},used=new Set();
  const numericCol=c=>{const v=data.slice(0,15).map(r=>(r[c]||"").toString().trim()).filter(Boolean);return v.length&&v.filter(x=>/^[\d.,]+$/.test(x)).length/v.length>.8;};
  const cand=[];
  head.forEach((hname,c)=>{if(!hname)return;tg.fields.forEach(([k,,syn],fi)=>{let s=0;const ix=syn.indexOf(hname);if(ix>=0)s=100-ix;else if(syn.some(x=>x.length>3&&hname.startsWith(x)))s=40;else if(syn.some(x=>x.length>3&&hname.includes(x)))s=20;
    if(hname==="item"){if(k==="lineNo"&&!numericCol(c))s=0;if(k==="description"&&numericCol(c))s=0;}
    if(s)cand.push({k,c,s});});});
  cand.sort((a,b)=>b.s-a.s).forEach(x=>{if(map[x.k]==null&&!used.has(x.c)){map[x.k]=x.c;used.add(x.c);}});

  return map;
}

async function fileToSheets(f){
  if(/\.xlsx$/i.test(f.name)){if(typeof DecompressionStream==="undefined")throw new Error("This browser can't read .xlsx — copy & paste the cells instead");return await readXlsx(await f.arrayBuffer());}
  if(/\.xls$/i.test(f.name))throw new Error("Old .xls format — save as .xlsx in Excel, or copy & paste the cells");

}

function impFromPaste(t){if(!t||!t.trim())return;impLoad([{name:"Pasted",rows:parseDelim(t,t.includes("\t")?"\t":",")}]);}
function impLoad(sheets){
  if(!impCtx)return;if(!sheets.length){toast("No data found");return;}

  sheets.forEach((s,i)=>{const hr=detectHeader(s.rows,tg);impCtx.hrs[i]=hr;impCtx.maps[i]=autoMap(s.rows,hr,tg);if(impRecords(i).length)impCtx.sel.add(i);});

function impRecords(i){

  const out=[];
  s.rows.slice(hr+1).forEach(r=>{if(!r)return;const rec={};tg.fields.forEach(([k])=>{const c=map[k];rec[k]=c!=null&&c>=0?((r[c]??"")+"").trim():"";});

    if(rec[tg.req]&&tg.fields.every(([k])=>k===tg.req||!rec[k])&&/^[A-Z\s\-–:]+$/.test(rec[tg.req])&&rec[tg.req].length<40)return; // section titles
    out.push(rec);});

function matRfq(m){return m.rfqRef?(DB.procurement||[]).find(p=>p.id===m.rfqRef):null;}

      .sort((a,b)=>(a.date||"").localeCompare(b.date||""));

  if(s.status==="Quote Received"){const tot=rfqLineTotal(r,s);txt="Quoted"+(tot?" · "+money(tot):"");}
  if(s.status==="Will Not Supply")txt="Can't supply";

function saveQuote2(){

      const pv=pe&&pe.value!==""?+pe.value:"";const resp=re?re.value:"Quoted";
      if(pv!==""||resp!=="Quoted"||(ne&&ne.value)){P[m.id]={price:pv,response:pv===""&&resp==="Quoted"?"No price given":resp,note:ne?ne.value:""};any=true;}});

function openCompare(rid){
  const r=DB.procurement.find(x=>x.id===rid);if(!r)return;
  formMode="compare";purCtx={rid};
  const mats=rfqMats(r).filter(m=>matStage(m)==="waiting");
  const sups=(r.suppliers||[]).filter(s=>s.prices&&s.status!=="Will Not Supply");
  if(!mats.length){toast("All items on this RFQ are already ordered");return;}
  const rows=mats.map(m=>{

function priceCats(){const s=new Set((DB.meta.priceCategories||[]).concat((DB.priceItems||[]).map(i=>i.category)).filter(Boolean));return Array.from(s).sort((a,b)=>a.localeCompare(b));}
function addPriceCat(after){
  uiAsk({title:"New price-book category",msg:"Category name (e.g. Expanded Metal, Gaskets, Consumables):",input:true,ok:"Add category",onOk:v=>{
    const n=(v||"").trim();if(!n)return;

    const name=ex||n;

  }});
}
function renamePriceCat(old){
  uiAsk({title:"Rename category",msg:"New name for “"+old+"”. Every item in it moves too.",input:true,value:old,ok:"Rename",onOk:v=>{
    const n=(v||"").trim();if(!n||n===old)return;

  const nq=(DB.priceQuotes||[]).filter(q=>ids.has(q.itemRef)).length,nm=(DB.materials||[]).filter(m=>ids.has(m.priceItemRef)).length;
  uiConfirm(`Delete the “${name}” category, its ${used} item${used>1?"s":""} and their ${nq} logged price${nq===1?"":"s"}?`+(nm?` ${nm} material line${nm>1?"s":""} priced from them will show “Find price” again.`:"")+" This can't be undone — back up first if unsure.",()=>{
    DB.priceItems=DB.priceItems.filter(i=>!ids.has(i.id));DB.priceQuotes=(DB.priceQuotes||[]).filter(q=>!ids.has(q.itemRef));

function catSelectChange(sel){

function copyRich(html,text,msg){

/* ============ v4: MATERIAL TABLE EDITOR ============ */
const GCOLS=[["lineNo","#",54],["description","Description *",200],["size","Size",130],["grade","Grade",100],["qtyReq","Qty",64],["unit","Unit",86],["length","Length",86],["notes","Notes",170]];
function gridBlank(){return {id:null,lineNo:"",description:"",size:"",grade:"",qtyReq:"",unit:"",length:"",notes:"",_del:false};}
function gridRowEmpty(r){return GCOLS.every(([k])=>!String(r[k]??"").trim());}
function startGrid(jobId){

  setTimeout(()=>{const i=rows.findIndex(r=>!r.id);const el=document.querySelector(`.mgrid input[data-r="${Math.max(0,i)}"][data-c="description"]`);if(el)el.focus();},40);
}
function gridRowHTML(r,i){
  const m=r.id?(DB.materials||[]).find(x=>x.id===r.id):null;
  return `<tr class="${r._del?"del":""}" data-row="${i}"><td class="rn">${i+1}</td>${GCOLS.map(([k,,w])=>`<td style="min-width:${w}px"><input data-r="${i}" data-c="${k}" value="${esc(r[k]??"")}" ${k==="qtyReq"?'inputmode="decimal"':""} ${k==="unit"?'list="unitlist"':""} oninput="gridSet(this)" onkeydown="gridKey(event,this)" onpaste="gridPaste(event,this)"></td>`).join("")}<td class="st">${m?esc(matStatus(m)):"new"}</td><td><button class="xb" title="${r.id?"Delete line (undo by tapping again)":"Clear row"}" onclick="gridDel(${i})">${r._del?"↺":"✕"}</button></td></tr>`;
}
function renderGrid2(j){
  const g=matGrid;
  const n=g.rows.filter(r=>!r._del&&!gridRowEmpty(r)).length;
  return `<div class="dsection"><h3><span class="ic">⊞</span> Material list — table entry</h3>
    <div class="impnote" style="margin-bottom:10px">Type like a spreadsheet: <b>Enter</b> or <b>↓</b> moves down, <b>Tab</b> moves right. Paste cells straight from Excel into any box and they fill across and down. New rows appear as you go. Nothing is saved until you tap <b>Save</b>.</div>
    <div class="gridwrap"><table class="mgrid"><thead><tr><th></th>${GCOLS.map(([,l])=>`<th>${l}</th>`).join("")}<th>Status</th><th></th></tr></thead><tbody id="gridbody">${g.rows.map(gridRowHTML).join("")}</tbody></table></div>
    <datalist id="unitlist">${["lengths","length","sheets","sheet","each","pcs","m","ft","kg","lot","bags","pails","rolls","gal"].map(u=>`<option value="${u}">`).join("")}</datalist>
    <div class="tbar" style="margin-top:12px"><button class="btn primary" onclick="gridSave()">Save ${n} line${n===1?"":"s"}</button><button class="btn" onclick="gridMore()">+ 10 rows</button><span style="flex:1"></span><button class="btn" onclick="gridCancel()">Cancel</button></div></div>`;
}
function gridEnsure(){
  const g=matGrid,tb=document.getElementById("gridbody");let blanks=0;
  for(let i=g.rows.length-1;i>=0&&!g.rows[i].id&&gridRowEmpty(g.rows[i]);i--)blanks++;
  while(blanks<2){g.rows.push(gridBlank());if(tb)tb.insertAdjacentHTML("beforeend",gridRowHTML(g.rows[g.rows.length-1],g.rows.length-1));blanks++;}
  gridCount();
}
function gridCount(){const b=document.querySelector(".dsection .tbar .btn.primary");if(!b||!matGrid)return;const n=matGrid.rows.filter(r=>!r._del&&!gridRowEmpty(r)).length;b.textContent="Save "+n+" line"+(n===1?"":"s");}
function gridSet(el){const r=matGrid.rows[+el.dataset.r];if(!r)return;r[el.dataset.c]=el.value;matGrid.dirty=true;const tr=el.closest("tr");if(tr)tr.classList.remove("bad");gridEnsure();}
function gridFocus(r,c){if(r>=matGrid.rows.length){matGrid.rows.push(gridBlank());const tb=document.getElementById("gridbody");if(tb)tb.insertAdjacentHTML("beforeend",gridRowHTML(matGrid.rows[r],r));}const el=document.querySelector(`.mgrid input[data-r="${r}"][data-c="${c}"]`);if(el){el.focus();try{el.select();}catch(e){}}}
function gridKey(e,el){
  const r=+el.dataset.r,c=el.dataset.c;
  if(e.key==="Enter"||e.key==="ArrowDown"){e.preventDefault();gridFocus(r+1,c);}
  else if(e.key==="ArrowUp"){e.preventDefault();if(r>0)gridFocus(r-1,c);}
}
function gridPaste(e,el){
  const t=(e.clipboardData||window.clipboardData).getData("text");
  if(!t||(!t.includes("\t")&&!t.includes("\n")))return;
  e.preventDefault();
  let rows=parseDelim(t.replace(/\n+$/,""),"\t").filter(r=>r.some(v=>(v||"").trim()));
  const tg=IMPORT_TARGETS.materials;let order=null;
  const hr=detectHeader(rows,tg);
  if(hr>=0){const map=autoMap(rows,hr,tg);order={};Object.keys(map).forEach(k=>{if(GCOLS.some(([c])=>c===k))order[k]=map[k];});rows=rows.slice(hr+1).filter(r=>!/^(sub\s*)?total\b|^grand total/i.test(((r[order.description]||"")+"").trim()));}
  const r0=+el.dataset.r,c0=GCOLS.findIndex(([k])=>k===el.dataset.c);
  rows.forEach((cells,i)=>{
    const ri=r0+i;while(matGrid.rows.length<=ri)matGrid.rows.push(gridBlank());const row=matGrid.rows[ri];
    if(order)Object.keys(order).forEach(k=>{row[k]=((cells[order[k]]??"")+"").trim();});
    else cells.forEach((v,ci)=>{const col=GCOLS[c0+ci];if(col)row[col[0]]=(v||"").trim();});
  });
  matGrid.dirty=true;renderDetail();gridEnsure();
  toast(rows.length+" row"+(rows.length>1?"s":"")+" pasted"+(order?" (columns matched from the header row)":""));
  gridFocus(r0,el.dataset.c);
}
function gridDel(i){const r=matGrid.rows[i];if(!r)return;if(r.id)r._del=!r._del;else GCOLS.forEach(([k])=>r[k]="");matGrid.dirty=true;renderDetail();}
function gridMore(){for(let i=0;i<10;i++)matGrid.rows.push(gridBlank());renderDetail();}
function gridCancel(){const close=()=>{matGrid=null;renderDetail();};if(matGrid&&matGrid.dirty)uiConfirm("Discard the changes in this table?",close,{ok:"Discard"});else close();}
function gridSave(){
  const g=matGrid;if(!g)return;
  const bad=[];g.rows.forEach((r,i)=>{if(!r._del&&!gridRowEmpty(r)&&!String(r.description).trim())bad.push(i);});
  if(bad.length){document.querySelectorAll(".mgrid tr").forEach(tr=>{if(bad.includes(+tr.dataset.row))tr.classList.add("bad");});toast(bad.length+" row"+(bad.length>1?"s need":" needs")+" a description");gridFocus(bad[0],"description");return;}
  const num=v=>{const x=parseFloat(String(v??"").replace(/,/g,""));return isNaN(x)?"":x;};
  let added=0,upd=0,del=0;const touched=[];
  const dels=g.rows.filter(r=>r.id&&r._del).map(r=>r.id);
  const go2=()=>{
    if(dels.length){DB.materials=DB.materials.filter(m=>!dels.includes(m.id));DB.procurement.forEach(p=>{if(p.materialRefs)p.materialRefs=p.materialRefs.filter(x=>!dels.includes(x));});del=dels.length;}
    g.rows.forEach(r=>{
      if(r._del||gridRowEmpty(r))return;
      const vals={lineNo:String(r.lineNo).trim(),description:String(r.description).trim(),size:String(r.size).trim(),grade:String(r.grade).trim(),qtyReq:num(r.qtyReq),unit:String(r.unit).trim(),length:String(r.length).trim(),notes:String(r.notes).trim()};
      if(r.id){const m=DB.materials.find(x=>x.id===r.id);if(!m)return;const changed=Object.keys(vals).some(k=>String(m[k]??"")!==String(vals[k]??""));if(!changed)return;
        const relink=["description","size","grade"].some(k=>String(m[k]??"")!==String(vals[k]??""));Object.assign(m,vals);if(relink&&!(+m.unitCost>0)&&!(+m.quotedPrice>0))m.priceItemRef="";upd++;touched.push(m);}
      else{const m=Object.assign({id:uid(),jobRef:g.jobId,qtyOrdered:0,qtyReceived:0,supplierRef:"",unitCost:"",heatNo:"",mtr:false,priceItemRef:"",group:""},vals);DB.materials.push(m);added++;touched.push(m);}
    });
    const pr=autoPriceMaterials(touched.filter(m=>!m.priceItemRef));
    matGrid=null;save();renderDetail();buildNav();
    toast([added&&added+" added",upd&&upd+" updated",del&&del+" deleted"].filter(Boolean).join(" · ")+(pr.linked?` · ${pr.linked} priced`:"")||"No changes");
  };

function saveSupItem(){
  const s=DB.suppliers.find(x=>x.id===purCtx.sid);const d={};document.querySelectorAll("#mbody [data-k]").forEach(el=>{d[el.dataset.k]=el.value;});
  const desc=(d.desc||"").trim();if(!desc){toast("Enter the item");return;}
  let it=(DB.priceItems||[]).find(i=>i.description.toLowerCase()===desc.toLowerCase());
  if(!it){const cat=d.category&&d.category!=="__new__"?d.category:((s.supplies||[])[0]||"Other");it={id:uid(),code:"",category:cat,description:desc,tags:"",stockLength:"",grade:"",uom:d.uom||"",notes:"",synonyms:""};DB.priceItems.push(it);}
  else if(d.uom&&!it.uom)it.uom=d.uom;
  if(priceGuard([priceOff(it.id,d.price)],saveSupItem))return;
  const seq=(DB.priceQuotes||[]).reduce((a,q)=>Math.max(a,q.seq||0),0)+1;
  DB.priceQuotes.push({id:uid(),itemRef:it.id,supplier:s.company,date:d.date||todayISO(),price:d.price===""?"":+d.price,response:d.price===""?"No price given":"Quoted",note:d.note||"",seq});
  if(it.category&&!(s.supplies||[]).includes(it.category)&&SCHEMA.suppliers.fields.find(f=>f.k==="supplies").opts.includes(it.category))s.supplies=(s.supplies||[]).concat([it.category]);
  pbInvalidate();save();closeForm();render();toast("Added to "+s.company+" and the price book");
}

/* ============ NAV ============ */
function buildNav(){
  const nav=document.getElementById("nav");
  const items=[["dashboard","Dashboard","🏠"],["jobs","Projects","📋"],["purchasing","Purchasing","📦"],["prices","Price Book","💲"],["qc","QC","✅"],["suppliers","Suppliers","🏭"],["reminders","Reminders","📌"],["settings","Settings","⚙️"]];
  nav.innerHTML=items.map(([id,label,ic])=>{
    let cnt="";
    if(id==="reminders"){const oc=openReminderCount();cnt=oc?`<span class="cnt">${oc}</span>`:"";}
    else if(id==="qc"){const f=qcOpenFails();cnt=f?`<span class="cnt" style="background:var(--bad);color:#fff">${f}</span>`:"";}
    else if(id==="prices")cnt=`<span class="cnt">${(DB.priceItems||[]).length}</span>`;
    else if(id==="purchasing"){const n=purCounts().toorder;cnt=n?`<span class="cnt">${n}</span>`:"";}
    else if(SCHEMA[id])cnt=`<span class="cnt">${(DB[id]||[]).length}</span>`;
    const active=(!detailJob&&id===current)||(detailJob&&id==="jobs");
    return `<button class="${active?'active':''}" title="${label}" onclick="go('${id}')"><span class="ic">${ic}</span><span class="lbl">${label}</span>${cnt}</button>`;
  }).join("");
}

function go(id){ setTimeout(pageAnim,0); listQ=""; gridFilters={}; supView=null; supCat=""; supRating=""; if(id==="materials"||id==="procurement"){if(id==="procurement")purStage="waiting";id="purchasing";} if(id!=="purchasing"){purQ="";} detailJob=null; current=id; sortKey=id==="jobs"?"jobName":null; sortDir=id==="jobs"?-1:1; jobFilter=null; currentView=SCHEMA[id]?SCHEMA[id].views[0]:id; matFilter=""; window.scrollTo&&window.scrollTo(0,0);  render(); buildNav(); }

  const vt=document.getElementById("viewtabs");
  if(PAGES[current]){

    ["addbtn","csvbtn","searchwrap"].forEach(id=>document.getElementById(id).style.display="none");
    vt.innerHTML="";return PAGES[current][1](c);

function viewLabel(v){return{grid:"Grid",kanban:"Board",calendar:"Calendar"}[v];}

/* ============ FILTER ============ */
function filteredRows(){
  let rows=(DB[current]||[]).slice();
  const q=listQ.trim().toLowerCase();
  const hayOf=r=>SCHEMA[current].fields.map(f=>{let v=r[f.k];if(f.t==="link")v=refName(f.to,v);if(Array.isArray(v))v=v.join(" ");return (v??"").toString();}).join(" ");
  if(q)rows=current==="jobs"?jobQ(rows,q,hayOf):rows.filter(r=>{const hay=hayOf(r).toLowerCase();return q.split(/\s+/).every(w=>hay.includes(w));});
  Object.keys(gridFilters).forEach(k=>{const v=gridFilters[k];if(v)rows=rows.filter(r=>(r[k]||"")===v);});
  if(current==="jobs"&&jobFilter){
    const F={quoteover:j=>{const s=jobState(j);return s.kind==="quote"&&s.overdue;},jobover:j=>{const s=jobState(j);return s.kind==="delivery"&&s.overdue;},
      soon:j=>jobState(j).soon,rfq:j=>j.phase===PH.RFQ,awaitingpo:j=>j.phase===PH.QUOTED,chase:j=>jobState(j).chase,active:j=>EXEC.includes(j.phase),
      onhold:j=>!isClosed(j)&&isOnHold(j),nodue:j=>{const s=jobState(j);return(s.kind==="quote"||s.kind==="delivery")&&!s.due;},nochecklist:jobNeedsChecklist,delivered:j=>j.phase===PH.DONE&&(j.deliveredDate||"").slice(0,4)===todayISO().slice(0,4)}[jobFilter];
    if(F)rows=rows.filter(F);
  }
  if(sortKey==="_due"){
    const key=j=>{const s=jobState(j);return isClosed(j)?"9999-12-31":(s.due||s.followUp||"9999-12-30");};
    rows.sort((a,b)=>{const x=key(a),y=key(b);return x<y?-sortDir:x>y?sortDir:0;});
  }else if(sortKey==="_pct"||sortKey==="_step"||sortKey==="_val"){
    const key=sortKey==="_pct"?jobPct:sortKey==="_val"?j=>jobValue(j)??-1:j=>currentStep(j).toLowerCase();
    rows.sort((a,b)=>{const x=key(a),y=key(b);return x<y?-sortDir:x>y?sortDir:0;});
  }else if(sortKey==="jobName"&&current==="jobs"){
    const key=j=>{const m=/^\s*(\d+)\s*$/.exec(j.jobId||"");return m?"1"+String(+m[1]).padStart(8,"0"):"0"+(j.jobName||"").toLowerCase();};   // numbered projects by number; others sort to the end of the newest-first list
    rows.sort((a,b)=>{const x=key(a),y=key(b);return x<y?-sortDir:x>y?sortDir:0;});
  }else if(sortKey){
    const f=SCHEMA[current].fields.find(x=>x.k===sortKey);
    rows.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];if(f&&f.t==="link"){x=refName(f.to,x);y=refName(f.to,y);}if(f&&f.t==="number"){x=+x||0;y=+y||0;}else{x=(x??"").toString().toLowerCase();y=(y??"").toString().toLowerCase();}return x<y?-sortDir:x>y?sortDir:0;});
  }
  return rows;
}

/* ============ GRID ============ */
function renderGrid(c){
  const sch=SCHEMA[current];
  const cols=sch.gridCols?sch.gridCols.map(k=>({_due:{k:"_due",l:"Due / next action"},_price:{k:"_price",l:"Best price"},_mstatus:{k:"_mstatus",l:"Status"},_step:{k:"_step",l:"Current step"},_pct:{k:"_pct",l:"Progress"},_val:{k:"_val",l:"Value"}})[k]||sch.fields.find(f=>f.k===k)):sch.fields.filter(f=>f.t!=="textarea"&&f.t!=="heading").slice(0,9);
  const selFields=sch.fields.filter(f=>f.t==="select"&&!f.noFilter);
  const fbar=selFields.length?`<div class="filters"><span class="lbl">Filter</span>`+selFields.map(f=>{const ops=optsFor(f);const cur=gridFilters[f.k]||"";return `<select data-filter="${f.k}" onchange="gridFilters['${f.k}']=this.value;render()" class="${cur?"on":""}"><option value="">${f.l}: All</option>${ops.map(o=>`<option ${cur===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;}).join("")+`</div>`:"";
  const rows=filteredRows();
  let body;
  if(!rows.length)body=(listQ||Object.values(gridFilters).some(Boolean)||jobFilter)?`<div class="empty"><div class="big">🔍</div>No ${sch.label.toLowerCase()} match. <button class="linkbtn" onclick="listQ='';gridFilters={};jobFilter=null;render()">Clear search &amp; filters</button></div>`:`<div class="empty"><div class="big">${sch.icon}</div>No ${sch.label.toLowerCase()} yet. Click <b>+ Add</b> to create one.</div>`;
  else{
    const head=cols.map(f=>`<th onclick="setSort('${f.k}')">${f.l}${sortKey===f.k?`<span class="arr">${sortDir>0?'▲':'▼'}</span>`:''}</th>`).join("")+`<th></th>`;
    const isJobs=current==="jobs";
    const trs=rows.map(r=>{
      const tds=cols.map(f=>{
        if(isJobs&&f.k===sch.primary)return `<td><button class="joblink" onclick="openJob('${r.id}')">${jobNo(r)?`<span class="jno">${esc(jobNo(r))}</span> · `:""}${esc(r[f.k]||"(untitled)")}</button></td>`;
        if(f.quick)return `<td>${quickCell(f,r,current)}</td>`;
        return `<td>${cellHTML(f,r)}</td>`;
      }).join("");
      let acts="";
      if(isJobs){
        acts+=`<button class="icobtn open" title="Open file" onclick="openJobFile('${r.id}')">📁</button>`;
        acts+=`<button class="icobtn open" title="Open project" onclick="openJob('${r.id}')">▸</button>`;
      }
      acts+=`<button class="icobtn" title="Edit" onclick="openForm('${r.id}')">✏️</button><button class="icobtn del" title="Delete" onclick="del('${r.id}')">🗑</button>`;
      return `<tr>${tds}<td><div class="rowact">${acts}</div></td></tr>`;
    }).join("");
    body=`<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${trs}</tbody></table></div>`;
  }
  const chip=(current==="jobs"&&jobFilter)?`<div class="filterbanner">Showing <b>${JOBFILTER_LABEL[jobFilter]||jobFilter}</b> <span class="cnt">${filteredRows().length}</span><button onclick="clearJobFilter()" title="Clear filter">✕ Clear</button></div>`:"";
  c.innerHTML=chip+fbar+listSearch()+body;
}
function setSort(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();}
function cellHTML(f,r){
  if(f.k==="_due"){const m=jobDueMeta(r);return `<span class="${m.cls}">${esc(m.txt)}</span>`;}
  if(f.k==="_price")return priceCell(r);
  if(f.k==="_mstatus")return matChip(r);
  if(f.k==="_val"){const v=jobValue(r),m=jobMargin(r);return v==null?"<span style='color:var(--ink-soft)'>—</span>":`<span class="valcell">${mv(v)}${m?`<span class="resp ${m.pct<minMargin()?"late":""}">${pct(m.pct)} margin</span>`:""}</span>`;}
  if(f.k==="_step"){const s=currentStep(r);return s?`<span class="stepcell">${esc(s)}</span>`:"<span style='color:var(--ink-soft)'>—</span>";}
  if(f.k==="_pct"){if(r.phase===PH.LOST)return "<span style='color:var(--ink-soft)'>—</span>";const p=jobPct(r);return `<div class="pbar" title="${p}% of schedule steps done"><span class="ptrack"><span class="pf ${p>=100?'full':''}" style="width:${p}%"></span></span><em>${p}%</em></div>`;}
  let v=r[f.k];
  if(f.phase&&v)return `<span class="badge" style="${tokStyle(PHASE_TOK[v]||"idle")}">${esc(v)}</span>`;
  if(f.t==="link")return v?`<span class="linktag">${esc(refName(f.to,v))}</span>`:"<span style='color:var(--ink-soft)'>—</span>";
  if(f.t==="checkbox")return v?"✅":"—";
  if(f.bar){const p=Math.min(100,Math.max(0,Math.round(+v||0)));return `<div class="pbar" title="${p}% complete"><span class="ptrack"><span class="pf ${p>=100?'full':''}" style="width:${p}%"></span></span><em>${p}%</em></div>`;}
  if(f.t==="multiselect")return(v&&v.length)?`<div class="chiprow">${v.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:"—";
  if(f.badge&&v)return `<span class="badge ${badgeClass(v)}">${esc(v)}</span>`;
  if(f.pri&&v)return `<span class="badge" style="${tokStyle(priTok(v))}">${esc(v)}</span>`;
  if(f.due&&v){const m=dueMeta(v,r.status);return `<span class="${m.cls}">${esc(m.txt)}</span>`;}

  return v?esc(v):"<span style='color:var(--ink-soft)'>—</span>";
}
const TOK={ok:["--ok-bg","--ok"],prog:["--info-bg","--info"],info:["--info-bg","--info"],warn:["--warn-bg","--warn"],bad:["--bad-bg","--bad"],idle:["--idle-bg","--idle"],hold:["--hold-bg","--hold"]};

function priTok(name){const p=metaArr("priorities").find(x=>x.name===name);return p?p.tok:(PRI_TOK[name]||"idle");}
function fieldTok(f,v){if(f.phase)return PHASE_TOK[v]||"idle";return (f.pri||f.dyn==="priorities")?priTok(v):statusTok(v);}
function optsFor(f){if(f.phase)return PHASES;if(f.dyn==="clients")return (DB.meta&&DB.meta.clients)||f.opts;if(f.dyn==="priorities")return priorityNames().length?priorityNames():f.opts;if(f.dyn==="checklistTypes")return checklistTypeNames().length?checklistTypeNames():f.opts;return f.opts;}

function quickCell(f,r,tbl){

/* ============ BOARD (projects by phase) ============

   wheel over a lane scrolls its cards, elsewhere it scrolls the board sideways; Shift+wheel / touchpad swipe = sideways.
   Drag a card (mouse, or press-and-hold on a phone) onto another lane — the phase dialog opens as usual. */
function renderKanban(c){

    const add=current==="jobs"&&st===PH.RFQ?`<button class="laneadd" onclick="openForm(null,'jobs')">+ Add project</button>`:"";
    return `<section class="lane" data-status="${esc(st)}"><header class="lanehd"><span class="dot" style="background:var(${dotVar(st)})"></span><span class="ln">${esc(st)}</span><span class="lcnt">${items.length}</span></header><div class="lanebody">${items.map(r=>kCard(r,sch)).join("")||`<div class="laneempty">No projects</div>`}</div>${add}</section>`;
  }).join("");
  c.innerHTML=listSearch()+`<div class="board kanban" id="board"><div class="boardscroll" id="boardscroll">${lanes}</div><button class="barrow l" aria-label="Previous lane" onclick="boardStep(-1)">‹</button><button class="barrow r" aria-label="Next lane" onclick="boardStep(1)">›</button></div>`;

function kCard(r){

let _boardWired=false;
function boardSize(){
  const b=document.getElementById("board");if(!b||!b.getBoundingClientRect)return;
  const top=b.getBoundingClientRect().top+(window.scrollY||0);
  b.style.height=Math.max(340,(window.innerHeight||800)-top-18)+"px";
  boardUpd();
}
function boardUpd(){
  const b=document.getElementById("board"),sc=document.getElementById("boardscroll");if(!b||!sc)return;
  const max=sc.scrollWidth-sc.clientWidth;
  b.classList.toggle("can-l",sc.scrollLeft>2);b.classList.toggle("can-r",sc.scrollLeft<max-2);
}
function boardStep(d){
  const sc=document.getElementById("boardscroll");if(!sc)return;
  const lanes=Array.from(sc.querySelectorAll(".lane"));if(!lanes.length)return;
  const x=sc.scrollLeft,base=lanes[0].offsetLeft,max=Math.max(0,sc.scrollWidth-sc.clientWidth);
  const pos=lanes.map(l=>l.offsetLeft-base);
  let t;
  if(d<0){const c=pos.filter(p=>p<x-4);t=c.length?c[c.length-1]:0;}          // the lane start just left of where we are
  else{const c=pos.find(p=>p>x+4);t=c==null?max:Math.min(c,max);}             // the next lane start, or the very end
  if(sc.scrollTo)sc.scrollTo({left:t,behavior:"smooth"});else sc.scrollLeft=t;
}
function initBoard(){
  const sc=document.getElementById("boardscroll");if(!sc)return;
  sc.addEventListener("scroll",boardUpd,{passive:true});
  sc.addEventListener("wheel",e=>{
    if(e.ctrlKey)return;
    const dx=e.deltaX||0,dy=e.deltaY||0;
    if(e.shiftKey){sc.scrollLeft+=dy||dx;e.preventDefault();return;}
    if(Math.abs(dx)>Math.abs(dy)){if(sc.scrollWidth>sc.clientWidth+1){sc.scrollLeft+=dx;e.preventDefault();}return;}   // thumb wheel (e.g. MX Master) / touchpad sideways: always moves the board
    const lb=e.target&&e.target.closest?e.target.closest(".lanebody"):null;
    if(lb&&lb.scrollHeight>lb.clientHeight+1)return;            // over a lane with more cards: scroll that lane
    if(sc.scrollWidth>sc.clientWidth+1){sc.scrollLeft+=dy;e.preventDefault();}
  },{passive:false});
  if(!_boardWired&&window.addEventListener&&document.addEventListener){_boardWired=true;window.addEventListener("resize",boardSize);
    document.addEventListener("touchmove",e=>{if(kdrag&&kdrag.active&&e.cancelable)e.preventDefault();},{passive:false});}
  boardSize();setTimeout(boardSize,60);
}
let kdrag=null;
function kDown(e,id){
  if(e.button>0||(e.target.closest&&e.target.closest("button")))return;
  const card=e.currentTarget;
  kdrag={id,card,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,touch:e.pointerType!=="mouse",active:false,moved:false,timer:null};
  if(kdrag.touch)kdrag.timer=setTimeout(()=>{if(kdrag&&!kdrag.moved)kStartDrag();},300);
  document.addEventListener("pointermove",kMove,{passive:false});
  document.addEventListener("pointerup",kUp);
  document.addEventListener("pointercancel",kCancel);
}
function kStartDrag(){
  if(!kdrag)return;kdrag.active=true;
  const r=kdrag.card.getBoundingClientRect(),g=kdrag.card.cloneNode(true);
  g.className="kcard kghost";g.removeAttribute("onpointerdown");g.style.width=r.width+"px";
  kdrag.dx=kdrag.x-r.left;kdrag.dy=kdrag.y-r.top;
  document.body.appendChild(g);kdrag.ghost=g;kdrag.card.classList.add("dragging");document.body.classList.add("kdragging");
  {const sc=document.getElementById("boardscroll");if(sc)sc.style.scrollSnapType="none";}   // snap would fight the edge auto-scroll

  kdrag.auto=setInterval(()=>{const sc=document.getElementById("boardscroll");if(!sc||!kdrag)return;const b=sc.getBoundingClientRect();
    if(kdrag.x<b.left+48)sc.scrollLeft-=14;else if(kdrag.x>b.right-48)sc.scrollLeft+=14;
    const lb=kLaneAt()&&kLaneAt().querySelector(".lanebody");if(lb){const lr=lb.getBoundingClientRect();if(kdrag.y<lr.top+30)lb.scrollTop-=10;else if(kdrag.y>lr.bottom-30)lb.scrollTop+=10;}},16);
}
function kPlace(){if(!kdrag||!kdrag.ghost)return;kdrag.ghost.style.transform=`translate(${kdrag.x-kdrag.dx}px,${kdrag.y-kdrag.dy}px) rotate(2deg)`;
  const ln=kLaneAt();document.querySelectorAll(".lane.drop").forEach(x=>{if(x!==ln)x.classList.remove("drop");});if(ln)ln.classList.add("drop");}
function kLaneAt(){if(!kdrag)return null;const el=document.elementFromPoint(kdrag.x,kdrag.y);return el&&el.closest?el.closest(".lane"):null;}
function kMove(e){
  if(!kdrag)return;kdrag.x=e.clientX;kdrag.y=e.clientY;const dist=Math.hypot(e.clientX-kdrag.x0,e.clientY-kdrag.y0);

function kUp(){

  kEndDrag();if(!d.moved)openJob(d.id);   // a plain tap / click opens the project
}
function kCancel(){kEndDrag();}
function kEndDrag(){
  if(!kdrag)return;clearTimeout(kdrag.timer);clearInterval(kdrag.auto);
  if(kdrag.ghost)kdrag.ghost.remove();if(kdrag.card)kdrag.card.classList.remove("dragging");
  document.body.classList.remove("kdragging");{const sc=document.getElementById("boardscroll");if(sc)sc.style.scrollSnapType="";}document.querySelectorAll(".lane.drop").forEach(x=>x.classList.remove("drop"));
  document.removeEventListener("pointermove",kMove);document.removeEventListener("pointerup",kUp);document.removeEventListener("pointercancel",kCancel);

/* ============ GANTT ============ */
function ganttSVG(jobFilter,opts){
  opts=opts||{};
  const rows=[];
  const jobsList=jobFilter?(DB.jobs||[]).filter(j=>j.id===jobFilter):(DB.jobs||[]).slice();
  jobsList.forEach(j=>{
    const tops=topTasks(j.id);
    if(!tops.length)return;
    if(!jobFilter)rows.push({type:"job",job:j});
    tops.forEach(t=>{rows.push({type:"task",task:t});taskKids(t.id).forEach(s=>rows.push({type:"sub",task:s}));});
  });
  if(!jobFilter){
    const orphans=(DB.tasks||[]).filter(t=>!t.parentTask&&(!t.jobRef||!DB.jobs.find(j=>j.id===t.jobRef)));
    if(orphans.length){rows.push({type:"job",job:{id:"none",jobName:"Unassigned"}});orphans.forEach(t=>{rows.push({type:"task",task:t});taskKids(t.id).forEach(s=>rows.push({type:"sub",task:s}));});}
  }
  const spans=rows.filter(r=>r.task).map(r=>taskSpan(r.task)).filter(s=>s.start&&s.end);
  if(!spans.length)return null;
  let minD=spans[0].start,maxD=spans[0].end;
  spans.forEach(s=>{if(s.start<minD)minD=s.start;if(s.end>maxD)maxD=s.end;});
  const start=new Date(minD+"T00:00:00");start.setDate(start.getDate()-3);
  const end=new Date(maxD+"T00:00:00");end.setDate(end.getDate()+3);
  const totalDays=Math.round((end-start)/86400000)+1;
  const dayW=totalDays<=45?16:totalDays<=90?10:6;
  const labelW=opts.labelW||250,rowH=30,headH=50;
  const chartW=totalDays*dayW,svgW=labelW+chartW+20,svgH=headH+rows.length*rowH+10;
  const x=iso=>labelW+Math.round((new Date(iso+"T00:00:00")-start)/86400000)*dayW;
  let g="";
  let cur=new Date(start),lastLbl=-99;
  while(cur<=end){
    const px=labelW+Math.round((cur-start)/86400000)*dayW;
    const isMonth=cur.getDate()===1,isMon=((cur.getDay()+6)%7)===0;
    if(isMonth||cur.getTime()===start.getTime()){g+=`<text class="gaxis gmonth" x="${px+3}" y="14">${cur.toLocaleDateString(undefined,{month:'short',year:cur.getMonth()===0||cur.getTime()===start.getTime()?'numeric':undefined})}</text>`;}
    if(isMonth)g+=`<line class="g-month" x1="${px}" y1="2" x2="${px}" y2="${svgH}" stroke-width="1.2"/>`;
    if(isMon){g+=`<line class="g-week" x1="${px}" y1="${headH-14}" x2="${px}" y2="${svgH}" stroke-width="1"/>`;if(px-lastLbl>=22){g+=`<text class="gaxis" x="${px+3}" y="${headH-18}">${cur.getDate()}</text>`;lastLbl=px;}}
    cur.setDate(cur.getDate()+1);
  }
  const tx=x(todayISO());
  if(tx>=labelW&&tx<=labelW+chartW){g+=`<line class="g-today" x1="${tx}" y1="${headH-8}" x2="${tx}" y2="${svgH}" stroke-width="1.5" stroke-dasharray="4 3"/>`;g+=`<text class="gaxis g-todayt" x="${tx+3}" y="${headH-4}">today</text>`;}
  g+=`<line class="g-base" x1="0" y1="${headH}" x2="${svgW}" y2="${headH}"/><line class="g-base" x1="${labelW}" y1="0" x2="${labelW}" y2="${svgH}"/>`;
  const taskY={};
  rows.forEach((row,i)=>{
    const y=headH+i*rowH;
    if(row.type==="job"){
      g+=`<rect class="g-jobrow" x="0" y="${y}" width="${svgW}" height="${rowH}"/>`;
      g+=`<text class="gjob" x="12" y="${y+rowH/2+4}">${esc(row.job.jobName)}</text>`;
    }else{
      const t=row.task;taskY[t.id]=y+rowH/2;
      const sub=row.type==="sub",lblX=sub?44:24;
      const maxChars=Math.floor((labelW-lblX-6)/6.2);
      let nm=t.taskName;if(nm.length>maxChars)nm=nm.slice(0,maxChars-1)+"…";
      g+=`<text class="${sub?'gsub':'glabel'}" x="${lblX}" y="${y+rowH/2+4}">${sub?'└ ':''}${esc(nm)}</text>`;
      const sp=taskSpan(t),isParent=taskKids(t.id).length>0;
      if(!sp.start||!sp.end)return;
      const bx=x(sp.start),bw=Math.max(dayW,(daysBetween(sp.start,sp.end)+1)*dayW),pct=taskPct(t);
      if(t.milestone){
        const cy=y+rowH/2,s=7;
        const mx=t.doneDate?x(t.doneDate)+dayW/2:bx;
        if(t.doneDate&&t.doneDate!==sp.start)g+=`<polygon class="g-plan" points="${bx},${cy-s} ${bx+s},${cy} ${bx},${cy+s} ${bx-s},${cy}"><title>planned ${esc(fmtShort(sp.start))}</title></polygon>`;
        g+=`<polygon class="${t.failed?"g-fail":t.status==="Done"?"g-done":"g-weld"}" points="${mx},${cy-s} ${mx+s},${cy} ${mx},${cy+s} ${mx-s},${cy}" stroke="#fff" stroke-width="1.5" style="cursor:pointer" onclick="openForm('${t.id}','tasks')"><title>${esc(t.taskName)}${t.doneDate?" — done "+esc(fmtShort(t.doneDate)):" (milestone)"}</title></polygon>`;
      }else if(isParent){
        const h=7,top=y+rowH/2-h/2;
        g+=`<rect class="g-parent2" x="${bx}" y="${top}" width="${bw}" height="${h}" rx="2" opacity="0.45"/>`;
        g+=`<rect class="g-parent" x="${bx}" y="${top}" width="${Math.round(bw*pct/100)}" height="${h}" rx="2"/>`;
        g+=`<polygon class="g-parent" points="${bx},${top+h} ${bx+5},${top+h} ${bx},${top+h+5}"/><polygon class="g-parent" points="${bx+bw},${top+h} ${bx+bw-5},${top+h} ${bx+bw},${top+h+5}"/>`;
        g+=`<rect x="${bx}" y="${y+5}" width="${bw}" height="${rowH-10}" fill="transparent" style="cursor:pointer" onclick="openForm('${t.id}','tasks')"><title>${esc(t.taskName)} — ${pct}% (rolled up)</title></rect>`;
      }else{
        const cls=t.failed?"g-fail":t.status==="Done"?"g-done":t.status==="In Progress"?"g-prog":"g-idle";
        if(t.doneDate&&t.doneDate!==sp.end&&t.status==="Done"){const ax=x(t.doneDate)+dayW/2;g+=`<circle cx="${ax}" cy="${y+rowH/2}" r="3.5" class="g-actual"><title>Actually done ${esc(fmtShort(t.doneDate))}</title></circle>`;}
        g+=`<rect class="${cls}" x="${bx}" y="${y+7}" width="${bw}" height="${rowH-14}" rx="4" opacity="0.28"/>`;
        g+=`<rect class="${cls}" x="${bx}" y="${y+7}" width="${Math.round(bw*Math.min(100,Math.max(0,pct))/100)}" height="${rowH-14}" rx="4"/>`;
        g+=`<rect x="${bx}" y="${y+7}" width="${bw}" height="${rowH-14}" rx="4" fill="transparent" style="cursor:pointer" onclick="openForm('${t.id}','tasks')"><title>${esc(t.taskName)} — ${pct}%</title></rect>`;
      }
    }
  });
  rows.forEach(row=>{
    if(row.task&&row.task.dependsOn&&taskY[row.task.dependsOn]!=null){
      const pre=DB.tasks.find(x=>x.id===row.task.dependsOn);if(!pre)return;
      const psp=taskSpan(pre),csp=taskSpan(row.task);if(!psp.end||!csp.start)return;
      const x1=x(psp.end)+dayW,y1=taskY[pre.id],x2=x(csp.start),y2=taskY[row.task.id];
      g+=`<path class="g-dep" d="M${x1},${y1} C${x1+14},${y1} ${x2-14},${y2} ${x2-6},${y2}" fill="none" stroke-width="1.3"/>`;
      g+=`<polygon class="g-deparr" points="${x2-6},${y2-3.5} ${x2},${y2} ${x2-6},${y2+3.5}"/>`;
    }
  });
  return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}">${g}</svg>`;
}

function addReminder(bucket,inputId){
  bucket=(bucket==="urgent"||bucket==="completed")?bucket:"todo";

  const el=document.getElementById(inputId);if(!el)return;
  const t=(el.value||"").trim();if(!t)return;

  DB.meta.reminders.unshift({id:uid(),num:++DB.meta.reminderSeq,text:t,bucket,date:todayISO()});
  save();render();
}
function toggleReminder(id){const r=(DB.meta.reminders||[]).find(x=>x.id===id);if(r){r.bucket=r.bucket==="completed"?"todo":"completed";save();render();}}

function addTTYear(){const y=parseInt((document.getElementById("hol-year")||{}).value,10);if(!(y>2000&&y<2100)){toast("Enter a valid year");return;}const have=new Set((DB.meta.holidays||[]).map(h=>h.date));const add=ttHolidays(y).filter(h=>!have.has(h.date));DB.meta.holidays=(DB.meta.holidays||[]).concat(add);save();render();toast(add.length+" holiday"+(add.length===1?"":"s")+" added for "+y+" — add Eid and Divali manually");}

function addPriority(){const nm=(document.getElementById("pr-name").value||"").trim();const tok=(document.getElementById("pr-col")||{}).value||"idle";if(!nm)return;DB.meta.priorities=DB.meta.priorities||[];if(DB.meta.priorities.some(p=>p.name.toLowerCase()===nm.toLowerCase())){toast("That priority already exists");return;}DB.meta.priorities.push({name:nm,tok});save();render();toast("Priority “"+nm+"” added");}
function removePriorityAt(i){const p=(DB.meta.priorities||[])[i];if(!p)return;const used=(DB.jobs||[]).filter(j=>j.priority===p.name).length;uiConfirm(`Remove priority “${p.name}”?`+(used?` ${used} project(s) use it.`:""),()=>{DB.meta.priorities.splice(i,1);save();render();toast("Priority removed");});}

function jobNeedsChecklist(j){const q=j.qc||{};return !isClosed(j)&&j.phase===PH.PROD&&!QC_STAGES.some(([k])=>q[k]&&q[k].s&&!q[k].auto);}
/* QC stages the project's workflow leaves out are set to N/A once (tap again to clear; it won't come back) */
function qcAutoNA(j){
  if(!j.jobType)return;j.qc=j.qc||{};if(!j.qcAuto||typeof j.qcAuto!=="object")j.qcAuto={};
  const out={weld:!j.optFab,blast:!j.optCoat,paint:!j.optCoat};
  Object.keys(out).forEach(k=>{const r=j.qc[k];
    if(out[k]){if(!j.qcAuto[k]){if(!(r&&r.s))j.qc[k]={s:"N/A",date:j.rfqDate||todayISO(),by:"auto",note:"Not in this project's scope",auto:true};j.qcAuto[k]=true;}}
    else{if(r&&r.auto)j.qc[k]={s:"",date:"",by:"",note:""};if(j.qcAuto[k])delete j.qcAuto[k];}
  });
}

/* ============ v7: PROJECT VALUE & COSTING (all figures excl. VAT) ============
   j.quotes  = [{rev,date,value,ref,note}]  — Rev 0 at "Quote submitted", Rev 1… from Re-quote; the latest is the quoted value
   j.poValue = value on the PO (pre-filled from the latest quote)
   j.costing = {lines:{key:{cost,markup,days}}, extra:[{id,label,cost,markup}]} — the costing sheet, cost column + markup %
   Materials come from the project's material list; labour = days × the day rate in Settings. */
const COST_LINES_DEFAULT=[
  {key:"paintTop",label:"Paint — top coat",markup:10},{key:"paintPrimer",label:"Paint — primer",markup:10},
  {key:"labFab",label:"Labour — fabrication",markup:35,labour:"fab"},{key:"labPaint",label:"Labour — blast & paint",markup:35,labour:"paint"},
  {key:"equip",label:"Equipment",markup:10},{key:"consum",label:"Consumables",markup:10},{key:"mat",label:"Materials",markup:20,auto:"materials"},
  {key:"machine",label:"Machine shop",markup:10},{key:"transport",label:"Transport",markup:0},{key:"mpi",label:"MPI / NDT",markup:0}];
function setCostMarkup(i,v){const a=JSON.parse(JSON.stringify(costLines()));if(!a[i])return;a[i].markup=Math.max(0,+v||0);DB.meta.costLines=a;save();toast("Default markup saved");}
function costLines(){const c=DB.meta&&DB.meta.costLines;return Array.isArray(c)&&c.length?c:COST_LINES_DEFAULT;}
function dayRate(k){const r=(DB.meta&&DB.meta.dayRates)||{};return +r[k]||0;}
function minMargin(){const v=DB.meta&&DB.meta.minMargin;return typeof v==="number"?v:10;}
function nz(v){return v!==""&&v!=null&&!isNaN(+v);}
function matCostExcl(j){return matTotals(jobMats(j.id)).cost;}
function jobCosting(j){
  const C=j.costing||{},S=C.lines||{};let cost=0,sell=0,any=false;
  const lines=costLines().map(t=>{const s=S[t.key]||{},markup=nz(s.markup)?+s.markup:t.markup;let c=0,auto=false,days=s.days,rate=0;
    if(t.auto==="materials"){if(nz(s.cost))c=+s.cost;else{c=matCostExcl(j);auto=true;}}
    else if(t.labour){rate=dayRate(t.labour);c=nz(s.cost)?+s.cost:(nz(days)?+days*rate:0);}
    else c=nz(s.cost)?+s.cost:0;
    if((nz(s.cost)&&+s.cost>0)||(nz(days)&&+days>0))any=true;
    const sl=c*(1+markup/100);cost+=c;sell+=sl;return {key:t.key,label:t.label,cost:c,markup,sell:sl,auto,days,rate,labour:t.labour};});
  (C.extra||[]).forEach(x=>{const c=+x.cost||0,mk=+x.markup||0,sl=c*(1+mk/100);if(c>0)any=true;cost+=c;sell+=sl;lines.push({key:x.id,label:x.label,cost:c,markup:mk,sell:sl,extra:true});});
  return {lines,cost,sell,has:any};
}
function quoteValue(j){const q=(j.quotes||[]).filter(x=>nz(x.value));return q.length?+q[q.length-1].value:null;}
function quoteRev(j){return Math.max(0,(j.quotes||[]).length-1);}
function poValue(j){return nz(j.poValue)?+j.poValue:null;}
/* the project's value: the PO once it's in, else the latest quote */
function jobValue(j){return reached(j,PH.PO)&&j.phase!==PH.LOST&&poValue(j)!=null?poValue(j):quoteValue(j);}
function jobMargin(j){const v=jobValue(j),c=jobCosting(j);if(v==null||!c.has)return null;return {amt:v-c.cost,pct:v>0?(v-c.cost)/v*100:0,cost:c.cost,value:v};}
function hideVals(){try{return localStorage.getItem("protrac_hidevals")==="1";}catch(e){return false;}}
function toggleHideVals(){try{localStorage.setItem("protrac_hidevals",hideVals()?"0":"1");}catch(e){}rerender();toast(hideVals()?"Values hidden on this device":"Values shown");}
function mv(n){return hideVals()?"$ •••":money(n==null?n:Math.round(+n*100)/100);}
function pct(n){return hideVals()?"••%":(Math.round(n*10)/10)+"%";}
/* Overview card */

    <div class="vgrid">${cell("Quoted"+(q!=null&&quoteRev(j)?" · Rev "+quoteRev(j):""),q!=null?mv(q):"—",(j.quotes||[]).length>1?"was "+mv(+(j.quotes[0].value)):"")}
      ${cell("PO value",po!=null?mv(po):"—",po!=null&&q!=null&&Math.abs(po-q)>0.5?(po<q?"below":"above")+" quote":"")}
      ${cell("Cost",c.has?mv(c.cost):"—",c.has?"materials "+mv(c.lines.find(l=>l.key==="mat").cost):"add a costing")}
      ${cell("Margin",m?`<span class="${low?"late":"ontime"}">${mv(m.amt)}</span>`:"—",m?pct(m.pct)+(low?" — below "+minMargin()+"%":""):"")}</div>
    ${(j.quotes||[]).length>1?`<div class="revlist">${j.quotes.map(x=>`<span class="chip">Rev ${x.rev} · ${esc(fmtShort(x.date))} · ${mv(x.value)}${x.note?" · "+esc(x.note):""}</span>`).join("")}</div>`:""}
  </div>`;
}

  openModal("Costing — "+jobLabel(j),`<div class="full impnote">All figures <b>excl. VAT</b>. Type the cost column (or paste the rows from your costing sheet) — sell, totals and margin work themselves out. Markups default from Settings.</div>

    <div class="full" id="costsheet"></div>
    <div class="full tablewrap"><table class="costtab"><thead><tr><th>Line</th><th>Cost</th><th>Markup</th><th>Sell</th></tr></thead><tbody id="costrows">${C.lines.map(row).join("")}</tbody></table></div>
    <div class="full"><button type="button" class="btn sm" onclick="costAddLine()">+ Line</button></div>
    <div class="full" id="costtot"></div>
    ${j.phase===PH.RFQ||!(j.quotes||[]).length?`<label class="full optchk" style="width:max-content"><input type="checkbox" id="costuseq" checked><span>Use the sell total as the quoted value</span></label>`:""}`,{wide:true,ok:"Save costing"});
  costCalc();

function costRead(){

/* paste rows from a costing sheet: name … qty, unit price / extended … markup % — matched to the standard lines by name */
const COST_MATCH=[["paintTop",/top\s*coat|topcoat|finish coat/i],["paintPrimer",/primer/i],["labFab",/labou?r.*fab|fab.*labou?r/i],["labPaint",/labou?r.*(blast|paint|coat)|(blast|paint).*labou?r/i],["equip",/equip/i],["consum",/consum/i],["mat",/material/i],["machine",/machin/i],["transport",/transport|deliver|truck/i],["mpi",/\bmpi\b|\bndt\b|inspection/i]];

function costImport(){pickXl(async f=>{try{const sh=await fileToSheets(f);
  const score=s=>(s.rows||[]).slice(0,40).some(r=>(r||[]).some(c=>/mark\s*-?up/i.test(c||"")))?2:(s.rows||[]).some(r=>(r||[]).some(c=>COST_MATCH.some(([,re])=>re.test(c||""))))?1:0;
  const best=sh.slice().sort((a,b)=>score(b)-score(a))[0];if(!best||!score(best)){toast("No costing table found in that file — copy the cells and paste them instead");return;}
  const p=document.getElementById("costpaste");if(p)p.hidden=true;costFromRows(best.rows,"imported from “"+f.name+"”"+(sh.length>1?" (sheet "+best.name+")":""));}catch(e){toast(e.message||"Couldn't read that file");}});}
/* rows from the costing sheet → the form. With a header row (… Qty | Unit price | Extended | Markup | Extended markup) columns are read by name;
   without one, a row is: name … numbers, where 3+ numbers = qty, unit, extended and a "%" cell is the markup. The "total" row gives the sheet's own quote total. */
function costFromRows(rows,how){
  rows=(rows||[]).map(r=>(r||[]).map(c=>(c==null?"":String(c)).trim()));
  const num=c=>{const v=parseFloat((c||"").replace(/[$,%\s]/g,""));return isNaN(v)?null:v;};
  const hi=rows.findIndex(r=>r.some(c=>/^mark\s*-?up$/i.test(c)));let col=null;
  if(hi>=0){const H=rows[hi].map(c=>c.toLowerCase());col={mk:H.findIndex(c=>/^mark\s*-?up$/.test(c)),ext:H.findIndex(c=>/^extended$|^ext\.?$|^cost$|^amount$/.test(c)),qty:H.findIndex(c=>/^qty|quantity/.test(c)),unit:H.findIndex(c=>/unit/.test(c)),sell:H.findIndex(c=>/extended\s*mark|sell|price to client/.test(c))};}
  let n=0,sheetTotal=null;
  rows.slice(hi+1).forEach(r=>{
    const label=r.find(c=>/[a-z]/i.test(c)&&num(c)==null);if(!label)return;
    if(/\btotal\b/i.test(label)){const v=col&&col.sell>=0?num(r[col.sell]):null;const nums=r.map(num).filter(v=>v!=null);sheetTotal=v!=null?v:nums.length?nums[nums.length-1]:null;return;}
    let cost=null,mk=null;
    if(col){const e=col.ext>=0?num(r[col.ext]):null,q=col.qty>=0?num(r[col.qty]):null,u=col.unit>=0?num(r[col.unit]):null;cost=e!=null?e:(q!=null&&u!=null?q*u:u);
      if(col.mk>=0){const raw=r[col.mk]||"",v=num(raw);if(v!=null)mk=/%/.test(raw)||v>1?v:v*100;}}
    else{const cells=r.filter(c=>c!==label&&c!==""&&c!=="$");const pc=cells.find(c=>/%$/.test(c));if(pc)mk=num(pc);const vals=cells.filter(c=>!/%$/.test(c)).map(num).filter(v=>v!=null);
      if(!vals.length)return;cost=vals.length>=3?vals[2]:vals.length===2?vals[0]*vals[1]:vals[0];}
    if(cost==null)return;cost=Math.round(cost*100)/100;
    const hit=COST_MATCH.find(([,re])=>re.test(label));
    if(hit){const k=hit[0],c=document.querySelector(`#mbody [data-cc="${k}"]`),m=document.querySelector(`#mbody [data-cm="${k}"]`),d=document.querySelector(`#mbody [data-cd="${k}"]`);
      if(c)c.value=cost;if(d)d.value="";if(m&&mk!=null)m.value=Math.round(mk*100)/100;n++;}
    else{costAddLine();const xs=document.querySelectorAll("#mbody [data-xl]"),last=xs[xs.length-1],id=last.dataset.xl;last.value=label.replace(/\s+/g," ");document.querySelector(`#mbody [data-xc="${id}"]`).value=cost;if(mk!=null)document.querySelector(`#mbody [data-xm="${id}"]`).value=Math.round(mk*100)/100;n++;}
  });
  costCalc();
  const j=(DB.jobs||[]).find(x=>x.id===editingId),C=j?jobCosting(Object.assign({},j,{costing:costRead()})):null;
  const chk=document.getElementById("costsheet");if(chk)chk.innerHTML=sheetTotal!=null&&C?(Math.abs(sheetTotal-C.sell)<1?`<div class="nudge" style="margin:0">✅ Matches the sheet's total of ${mv(sheetTotal)}.</div>`:`<div class="nudge" style="margin:0">⚠ The sheet's total is ${mv(sheetTotal)}, these lines add up to ${mv(C.sell)} — check a line or markup.</div>`):"";
  if(sheetTotal!=null&&j)j._sheetTotal=sheetTotal;
  toast(n?n+" line"+(n>1?"s":"")+" "+how+" — check and save":"Couldn't read any lines — include the line names, cost and markup %");
}

  let p=path.trim();
  if(/^https?:\/\//i.test(p)){window.open(p,"_blank");return;}
  let url=p.replace(/\\/g,"/");
  if(/^[a-zA-Z]:\//.test(url))url="file:///"+url;
  else if(/^\/\//.test(p))url="file://"+url;
  else if(url.startsWith("/"))url="file://"+url;
  else url="file:///"+url;
  let win=null; try{win=window.open(url,"_blank");}catch(e){win=null;}
  copyText(p, win?"Trying to open… if your browser blocked it, the path is now copied — paste it into your file explorer.":"Path copied — paste it into your file explorer's address bar to open.");
}
function copyText(t,msg){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast(msg),()=>fallbackCopy(t,msg));} else fallbackCopy(t,msg); }

}
function csvDownload(head,rows,name){
  const q=v=>'"'+(v??"").toString().replace(/"/g,'""')+'"';
  const csv=head.map(q).join(",")+"\n"+rows.map(r=>r.map(q).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  saveFile("Protrac_"+name+"_"+todayISO()+".csv",blob,"CSV saved");
}

/* scrollbars show while scrolling; sideways-scrolling areas get edge fades */
(function(){
  const sel=".tablewrap,.stepper,.tlstrip,.jtabs,.settabs,.pchips";
  const fade=el=>{const max=el.scrollWidth-el.clientWidth;el.classList.toggle("fade-l",max>2&&el.scrollLeft>2);el.classList.toggle("fade-r",max>2&&el.scrollLeft<max-2);};
  const all=()=>document.querySelectorAll(sel).forEach(fade);
  document.addEventListener("scroll",e=>{const el=e.target&&e.target.nodeType===1?e.target:document.documentElement;el.classList.add("is-scrolling");clearTimeout(el._sbt);el._sbt=setTimeout(()=>el.classList.remove("is-scrolling"),900);if(el.matches&&el.matches(sel))fade(el);},true);
  let t=0;const later=()=>{clearTimeout(t);t=setTimeout(all,40);};
  if(typeof MutationObserver!=="undefined"){const c=document.getElementById("content");if(c)new MutationObserver(later).observe(c,{childList:true,subtree:true});}
  if(window.addEventListener)window.addEventListener("resize",later);later();
})();
