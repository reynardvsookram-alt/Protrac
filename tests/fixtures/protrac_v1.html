/* ============ DASHBOARD ============ */
function renderDashboard(c){
  const jobs=DB.jobs||[];
  const S=jobs.map(j=>({j,s:jobState(j)}));
  const n=f=>S.filter(f).length;
  const kpis=[
    ["c-bad",n(x=>x.s.kind==="quote"&&x.s.overdue),"Quotes overdue","quoteover"],
    ["c-bad",n(x=>x.s.kind==="delivery"&&x.s.overdue),"Jobs overdue","jobover"],
    ["c-warn",n(x=>x.s.soon),"Due ≤ 5 working days","soon"],
    ["c-info",n(x=>x.j.phase===PH.RFQ),"RFQs to quote","rfq"],
    ["c-info",n(x=>x.j.phase===PH.QUOTED),"Awaiting PO","awaitingpo"],
    ["c-ok",n(x=>EXEC.includes(x.j.phase)),"Active jobs","active"]
  ];
  const cards=kpis.map(([cl,v,l,k])=>`<div class="statcard clickable ${cl}" onclick="dashFilter('${k}')" title="Show ${l.toLowerCase()} in Jobs"><div class="n">${v}</div><div class="l">${l}</div><span class="kpi-go">→</span></div>`).join("");
  const awaiting=allLines().filter(x=>x.s.status==="RFQ Sent");
  const chase=n(x=>x.s.chase), held=n(x=>!isClosed(x.j)&&isOnHold(x.j)), noDue=n(x=>(x.s.kind==="quote"||x.s.kind==="delivery")&&!x.s.due);
  const sub=(cls,ic,cnt,txt,fn)=>cnt?`<div class="kpi-sub ${cls}" onclick="${fn}"><span>${ic}</span> <b>${cnt}</b> ${txt} <span class="kpi-go">→</span></div>`:"";
  const subline=sub("","☎",chase,"quote"+(chase>1?"s":"")+" past follow-up — chase client for PO","dashFilter('chase')")
    +sub("","🔖",awaiting.length,"supplier quote"+(awaiting.length>1?"s":"")+" awaited — chase suppliers","dashGo('procurement')")
    +sub("warn","⏸",held,"job"+(held>1?"s":"")+" on hold (clock paused)","dashFilter('onhold')")
    +sub("warn","❔",noDue,"job"+(noDue>1?"s":"")+" missing a deadline or lead time — can't track overdue","dashFilter('nodue')");
  const noChkCount=jobs.filter(jobNeedsChecklist).length;
  const chkNudge=noChkCount?`<div class="kpi-sub warn" onclick="dashFilter('nochecklist')" title="Show these jobs"><span>⚠️</span> <b>${noChkCount}</b> job${noChkCount>1?"s":""} in production with no QC checklist <span class="kpi-go">→</span></div>`:"";
  // Reminders / notes (dashboard glance: open items, urgent first)
  const rem=(DB.meta&&DB.meta.reminders)||[];
  const openRem=rem.filter(r=>r.bucket!=="completed").sort((a,b)=>(a.bucket==="urgent"?0:1)-(b.bucket==="urgent"?0:1));
  const remList=openRem.length?openRem.slice(0,8).map(r=>`<div class="rem-item ${r.bucket==='urgent'?'urgent':''}"><button class="rem-chk" onclick="toggleReminder('${r.id}')" title="Mark done">⬜</button><span class="rem-txt">${r.bucket==='urgent'?'<span class="rem-tag">URGENT</span> ':''}${esc(r.text).replace(/\n/g,"<br>")}</span><button class="rem-x" title="Delete" onclick="delReminder('${r.id}')">×</button></div>`).join(""):`<div class="minimsg">No open reminders. Add a note to prompt yourself next time you open the tracker.</div>`;
  const reminders=`<div class="panel remindpanel"><h3>📌 Reminders &amp; notes <a class="panellink" onclick="go('reminders')">Open page →</a></h3>
    <div class="rem-add"><input id="remind-in" placeholder="Add a quick reminder…" onkeydown="if(event.key==='Enter')addReminder('todo','remind-in')"><button class="btn primary" onclick="addReminder('todo','remind-in')">Add</button></div>
    <div class="rem-list">${remList}</div></div>`;
  // Recent updates feed
  const feed=[];
  jobs.forEach(j=>(j.updates||[]).forEach((u,idx)=>feed.push({j,u,idx})));
  feed.sort((a,b)=>{const d=(b.u.date||"").localeCompare(a.u.date||"");if(d)return d;return ((b.u.ts||0)-(a.u.ts||0))||(b.idx-a.idx);});
  const recent=feed.slice(0,8);
  const recentHtml=recent.length?recent.map(({j,u})=>`<div class="rc-item" onclick="openJob('${j.id}')"><div class="rc-top"><span class="rc-job">${esc(j.jobName)}</span><span class="rc-date">${esc(fmtShort(u.date))}</span></div><div class="rc-text">${esc(u.text).replace(/\n/g,"<br>")}</div></div>`).join(""):`<div class="minimsg">No updates logged yet. Open a job and post an update — your latest notes show here so you can pick up where you left off.</div>`;
  const recentPanel=`<div class="panel"><h3>🕘 Recent updates</h3><div class="recent">${recentHtml}</div></div>`;
  // Pipeline by phase
  const max=Math.max(1,...PHASES.map(p=>jobs.filter(j=>j.phase===p).length));
  const bars=PHASES.map(p=>{const v=jobs.filter(j=>j.phase===p).length;return `<div class="sbrow"><span class="nm">${esc(p)}</span><span class="track"><span class="fill" style="width:${v/max*100}%;background:var(${dotVar(p)})"></span></span><span class="v">${v}</span></div>`;}).join("");
  const statusPanel=`<div class="panel"><h3>Pipeline by phase</h3><div class="statusbar">${bars}</div></div>`;
  // Next deadlines (quote deadlines, delivery dates, client follow-ups)
  const up=S.filter(x=>!isClosed(x.j)&&!x.s.paused&&(x.s.due||x.s.followUp)).sort((a,b)=>{const x=a.s.due||a.s.followUp,y=b.s.due||b.s.followUp;return x<y?-1:x>y?1:0;}).slice(0,8);
  const tag={quote:"Quote",delivery:"Delivery",followup:"Follow-up"};
  const uphtml=up.length?up.map(({j,s})=>{const m=jobDueMeta(j);return `<div class="u"><span class="kindtag">${tag[s.kind]}</span><span class="nm" onclick="openJob('${j.id}')">${esc(j.jobName)}</span><span class="cl">${esc(fmtShort(s.due||s.followUp))}</span><span class="${m.cls}">${esc(m.txt)}</span></div>`;}).join(""):`<div style="color:var(--ink-soft);padding:8px 0">No upcoming deadlines.</div>`;
  const duePanel=`<div class="panel"><h3>Next deadlines</h3><div class="upnext">${uphtml}</div></div>`;
  c.innerHTML=`<div class="cards">${cards}</div><div class="sublines">${subline}${chkNudge}</div>
    <div class="dashrow">${reminders}${statusPanel}</div>
    <div class="dashrow" style="margin-top:14px">${recentPanel}${duePanel}</div>`;
}
function addReminder(bucket,inputId){
  bucket=(bucket==="urgent"||bucket==="completed")?bucket:"todo";
  inputId=inputId||"remind-in";
  const el=document.getElementById(inputId);if(!el)return;
  const t=(el.value||"").trim();if(!t)return;
  DB.meta.reminders=DB.meta.reminders||[];
  if(typeof DB.meta.reminderSeq!=="number")DB.meta.reminderSeq=0;
  DB.meta.reminders.unshift({id:uid(),num:++DB.meta.reminderSeq,text:t,bucket,date:todayISO()});
  save();render();
}
function toggleReminder(id){const r=(DB.meta.reminders||[]).find(x=>x.id===id);if(r){r.bucket=r.bucket==="completed"?"todo":"completed";save();render();}}
function moveReminder(id,bucket){const r=(DB.meta.reminders||[]).find(x=>x.id===id);if(r){r.bucket=bucket;save();render();}}
function delReminder(id){DB.meta.reminders=(DB.meta.reminders||[]).filter(x=>x.id!==id);save();render();}
function openReminderCount(){return((DB.meta&&DB.meta.reminders)||[]).filter(r=>r.bucket!=="completed").length;}
function renderReminders(c){
  const rem=(DB.meta&&DB.meta.reminders)||[];
  const cols=[["urgent","🔴 Urgent","urg"],["todo","🟠 To Do","tod"],["completed","✅ Completed","cmp"]];
  const card=r=>{
    const acts=r.bucket==="urgent"
      ?`<button class="btn xs" onclick="moveReminder('${r.id}','todo')" title="Move to To Do">→ To&nbsp;Do</button><button class="btn xs ok" onclick="moveReminder('${r.id}','completed')">✓ Done</button>`
      :r.bucket==="todo"
      ?`<button class="btn xs" onclick="moveReminder('${r.id}','urgent')" title="Mark urgent">↑ Urgent</button><button class="btn xs ok" onclick="moveReminder('${r.id}','completed')">✓ Done</button>`
      :`<button class="btn xs" onclick="moveReminder('${r.id}','todo')" title="Reopen">↺ Reopen</button>`;
    return `<div class="rcard ${r.bucket}"><div class="rcard-top"><span class="rnum">#${String(r.num||0).padStart(3,"0")}</span><button class="rem-x" onclick="delReminder('${r.id}')" title="Delete">×</button></div><div class="rcard-text">${esc(r.text).replace(/\n/g,"<br>")}</div><div class="rcard-acts">${acts}</div></div>`;
  };
  const colHtml=cols.map(([b,label,cls])=>{
    const items=rem.filter(r=>r.bucket===b);
    const add=b!=="completed"?`<div class="rcol-add"><input id="rem-in-${b}" placeholder="Add to ${b==='urgent'?'Urgent':'To Do'}…" onkeydown="if(event.key==='Enter')addReminder('${b}','rem-in-${b}')"><button class="btn primary sm" onclick="addReminder('${b}','rem-in-${b}')">Add</button></div>`:"";
    const body=items.length?items.map(card).join(""):`<div class="minimsg">Nothing here${b==='completed'?' yet':''}.</div>`;
    return `<div class="rcol ${cls}"><h3>${label} <span class="cnt">${items.length}</span></h3>${add}<div class="rcol-body">${body}</div></div>`;
  }).join("");
  c.innerHTML=`<div class="reminfo">Your personal to-dos and notes, kept separate from formal job statuses. <b>Urgent</b> shows first — the quick things to clear each morning.</div><div class="remcols">${colHtml}</div>`;
}

function holidayRows(){

function addHoliday(){const d=(document.getElementById("hol-date").value||"").trim(),nm=(document.getElementById("hol-name").value||"").trim();if(!d){toast("Pick a date");return;}DB.meta.holidays=DB.meta.holidays||[];if(DB.meta.holidays.some(h=>h.date===d)){toast("That date is already a holiday");return;}DB.meta.holidays.push({date:d,name:nm||"Holiday"});save();render();toast("Holiday added — due dates recalculated");}

function addTTYear(){const y=parseInt((document.getElementById("hol-year")||{}).value,10);if(!(y>2000&&y<2100)){toast("Enter a valid year");return;}const have=new Set((DB.meta.holidays||[]).map(h=>h.date));const add=ttHolidays(y).filter(h=>!have.has(h.date));DB.meta.holidays=(DB.meta.holidays||[]).concat(add);save();render();toast(add.length+" holiday"+(add.length===1?"":"s")+" added for "+y+" — add Eid and Divali manually");}

function applyTemplate(jobId){

function moveItemAt(kind,i,dir){const a=DB.meta[kind];if(!a)return;const j=i+dir;if(j<0||j>=a.length)return;const t=a[i];a[i]=a[j];a[j]=t;save();render();}
function addClientS(){const nm=(document.getElementById("cl-name").value||"").trim();if(!nm)return;DB.meta.clients=DB.meta.clients||[];if(DB.meta.clients.some(c=>c.toLowerCase()===nm.toLowerCase())){toast("Client already exists");return;}DB.meta.clients.push(nm);DB.meta.clients.sort((a,b)=>a.localeCompare(b));save();render();toast("Client “"+nm+"” added");}
function removeClientAt(i){const name=(DB.meta.clients||[])[i];if(name==null)return;const used=(DB.jobs||[]).filter(j=>j.client===name).length;if(!confirm(`Remove client “${name}”?`+(used?` ${used} job(s) use it — they keep the label.`:"")))return;DB.meta.clients.splice(i,1);save();render();toast("Client removed");}

/* ============ PROCUREMENT (RFQ) ============ */
function renderProcurement(c){
  const q=document.getElementById("search").value.trim().toLowerCase();
  let rfqs=(DB.procurement||[]).slice();
  if(q)rfqs=rfqs.filter(r=>[r.rfqNumber,r.item,refName("jobs",r.jobRef),(r.suppliers||[]).map(s=>refName("suppliers",s.supplierRef)).join(" ")].join(" ").toLowerCase().includes(q));
  const lines=allLines();
  const awaiting=lines.filter(x=>x.s.status==="RFQ Sent");
  const quoted=lines.filter(x=>x.s.status==="Quote Received");
  const awarded=lines.filter(x=>x.s.awarded);
  const cards=[["c-info",(DB.procurement||[]).length,"RFQs"],["c-warn",awaiting.length,"Awaiting quote"],["c-ok",quoted.length,"Quotes received"],["c-info",awarded.length,"Awarded lines"]].map(([cl,n,l])=>`<div class="statcard ${cl}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
  const waits=awaiting.map(x=>({name:refName("suppliers",x.s.supplierRef)||"(no supplier)",item:x.r.item||x.r.rfqNumber||"RFQ",job:refName("jobs",x.r.jobRef),days:lineWait(x.s)||0})).sort((a,b)=>b.days-a.days);
  const waitPanel=waits.length?`<div class="panel waitpanel"><h3>Awaiting quotes — longest first</h3><div class="waitlist">${waits.map(w=>`<div class="w"><span class="sup">${esc(w.name)}</span><span class="it">${esc(w.item)}${w.job?" · "+esc(w.job):""}</span><span class="dd ${w.days>7?'overdue':w.days>3?'duesoon':''}">${w.days}d</span></div>`).join("")}</div></div>`:"";
  const list=rfqs.length?rfqs.map(rfqCard).join(""):`<div class="empty"><div class="big">📦</div>No RFQs yet. Click <b>+ Add</b> to raise one, then add the suppliers you sent it to.</div>`;
  c.innerHTML=`<div class="cards">${cards}</div>${waitPanel}${list}`;
}
function rfqCard(rfq){
  const job=refName("jobs",rfq.jobRef);
  const lines=rfq.suppliers||[];
  const body=lines.length?lines.map(ln=>{
    const wait=lineWait(ln);
    const waitHtml=wait!=null?`<span class="${wait>7?'overdue':wait>3?'duesoon':''}">${wait}d</span>`:(ln.status==="Quote Received"?`<span style="color:var(--ok);font-weight:700">quoted ✓</span>`:(ln.status==="Will Not Supply"?`<span style="color:var(--bad)">declined</span>`:"—"));
    const sel=`<select class="linesel" onchange="setLineStatus('${rfq.id}','${ln.id}',this.value)">${LINE_STATUS.map(o=>`<option ${ln.status===o?'selected':''}>${o}</option>`).join("")}</select>`;
    return `<tr>
      <td><b>${esc(refName("suppliers",ln.supplierRef))||'<span style="color:var(--ink-soft)">— none —</span>'}</b>${ln.notes?`<div style="font-size:11px;color:var(--ink-soft);margin-top:2px;white-space:pre-wrap">${esc(ln.notes)}</div>`:""}</td>
      <td>${sel}</td>
      <td class="cellmono">${ln.dateSent?fmtShort(ln.dateSent):"—"}</td>
      <td>${waitHtml}</td>
      <td class="cellmono">${ln.eta?fmtShort(ln.eta):"—"}</td>
      <td style="text-align:center"><input class="awcb" type="checkbox" ${ln.awarded?"checked":""} onchange="toggleAwarded('${rfq.id}','${ln.id}',this.checked)" title="Awarded — taking items from this supplier"></td>
      <td><div class="rowact"><button class="icobtn" title="Edit line" onclick="openLine('${rfq.id}','${ln.id}')">✏️</button><button class="icobtn del" title="Remove" onclick="delLine('${rfq.id}','${ln.id}')">🗑</button></div></td>
    </tr>`;
  }).join(""):`<tr><td colspan="7" style="padding:9px;color:var(--ink-soft)">No suppliers yet — add the suppliers you sent this RFQ to.</td></tr>`;
  return `<div class="rfqcard">
    <div class="rfqhead">
      <div class="rfqtitle">${rfq.rfqNumber?`<span class="rfqnum">${esc(rfq.rfqNumber)}</span>`:""}<span class="rfqitem">${esc(rfq.item||"(items not specified)")}</span></div>
      <div class="rfqmeta">${job?`<span class="chip">📋 ${esc(job)}</span>`:""}${(rfq.qtyRequested||rfq.qtyRequested===0)&&rfq.qtyRequested!==""?`<span class="chip">Qty ${esc(rfq.qtyRequested)}</span>`:""}${rfq.date?`<span class="chip">📅 ${esc(fmtShort(rfq.date))}</span>`:""}</div>
      <div class="rfqacts"><button class="btn sm" onclick="openForm('${rfq.id}','procurement')">Edit RFQ</button><button class="icobtn del" title="Delete RFQ" onclick="del('${rfq.id}','procurement')">🗑</button></div>
    </div>
    ${rfq.notes?`<div class="rfqnotes">${esc(rfq.notes)}</div>`:""}
    <table class="rfqtable"><thead><tr><th>Supplier</th><th>Status</th><th>Sent</th><th>Waiting</th><th>ETA</th><th>Awarded</th><th></th></tr></thead><tbody>${body}</tbody></table>
    <button class="miniadd" onclick="openLine('${rfq.id}')">+ Add supplier to this RFQ</button>
  </div>`;
}
function setLineStatus(rfqId,lineId,val){const r=DB.procurement.find(x=>x.id===rfqId);const ln=r.suppliers.find(s=>s.id===lineId);if(!ln)return;ln.status=val;if(val==="Quote Received"&&!ln.dateSent)ln.dateSent=ln.dateSent||"";save();rerender();}
function toggleAwarded(rfqId,lineId,val){const r=DB.procurement.find(x=>x.id===rfqId);const ln=r.suppliers.find(s=>s.id===lineId);if(!ln)return;ln.awarded=val;save();rerender();}
function delLine(rfqId,lineId){const r=DB.procurement.find(x=>x.id===rfqId);const ln=r.suppliers.find(s=>s.id===lineId);if(!confirm(`Remove ${refName("suppliers",ln.supplierRef)||"this supplier"} from the RFQ?`))return;r.suppliers=r.suppliers.filter(s=>s.id!==lineId);save();rerender();toast("Removed");}
function openLine(rfqId,lineId){
  formMode="line"; lineCtx={rfqId,lineId:lineId||null};
  const rfq=DB.procurement.find(r=>r.id===rfqId);
  const ln=lineId?rfq.suppliers.find(s=>s.id===lineId):{};
  document.getElementById("mtitle").textContent=(lineId?"Edit ":"Add ")+"supplier line";
  const supOpts=(DB.suppliers||[]).slice().sort((a,b)=>a.company<b.company?-1:1).map(s=>`<option value="${s.id}" ${ln.supplierRef===s.id?"selected":""}>${esc(s.company)}</option>`).join("");
  document.getElementById("mbody").innerHTML=`
    <div class="field full"><label>Supplier</label><select data-k="supplierRef"><option value="">— select —</option>${supOpts}</select></div>
    <div class="field"><label>Status</label><select data-k="status">${LINE_STATUS.map(o=>`<option ${(ln.status||"RFQ Sent")===o?"selected":""}>${o}</option>`).join("")}</select></div>
    <div class="field"><label>Date RFQ sent</label><input type="date" data-k="dateSent" value="${esc(ln.dateSent||todayISO())}"></div>
    <div class="field"><label>ETA (if quoted/ordered)</label><input type="date" data-k="eta" value="${esc(ln.eta||"")}"></div>
    <div class="field"><label>Awarded?</label><div class="cbwrap"><input type="checkbox" data-k="awarded" ${ln.awarded?"checked":""}><span style="font-size:12px;color:var(--ink-soft)">Taking items from this supplier</span></div></div>
    <div class="field full"><label>Notes (which items / qty from them, price, etc.)</label><textarea data-k="notes">${esc(ln.notes||"")}</textarea></div>`;
  document.getElementById("scrim").classList.add("show");
  const f=document.querySelector("#mbody [data-k]");if(f)setTimeout(()=>f.focus(),30);
}
function saveLine(){
  const rfq=DB.procurement.find(r=>r.id===lineCtx.rfqId);
  const data={};
  document.querySelectorAll("#mbody [data-k]").forEach(el=>{const k=el.dataset.k;data[k]=el.type==="checkbox"?el.checked:el.value;});
  if(!data.supplierRef){toast("Pick a supplier");return;}
  if(lineCtx.lineId)Object.assign(rfq.suppliers.find(s=>s.id===lineCtx.lineId),data);
  else (rfq.suppliers=rfq.suppliers||[]).push(Object.assign({id:uid()},data));
  save();closeForm();rerender();toast(lineCtx.lineId?"Saved":"Supplier added");
}

/* ============ JOB DETAIL ============ */
function openJob(id){ detailJob=id; detailTab="overview"; document.getElementById("search").value=""; renderDetail(); buildNav(); }
function setDetailTab(t){ detailTab=t; renderDetail(); }
function renderDetail(){
  const j=(DB.jobs||[]).find(x=>x.id===detailJob);
  if(!j){go("jobs");return;}
  document.getElementById("viewtitle").textContent=j.jobName;
  document.getElementById("viewtabs").innerHTML="";
  document.getElementById("addbtn").style.display="none";
  document.getElementById("csvbtn").style.display="none";
  document.getElementById("searchwrap").style.display="none";
  const m=jobDueMeta(j);
  const oh=openHold(j);
  const meta=`<span class="badge" style="${tokStyle(PHASE_TOK[j.phase]||"idle")}">${esc(j.phase||"—")}</span>
    ${oh?`<span class="badge b-hold">⏸ On hold</span>`:""}
    ${j.stage?`<span class="badge" style="${tokStyle(stageTok(j.stage))}">${esc(j.stage)}</span>`:""}
    ${j.priority?`<span class="badge" style="${tokStyle(priTok(j.priority))}">${esc(j.priority)}</span>`:""}
    ${j.client?`<span class="chip">${esc(j.client)}</span>`:""}
    ${j.jobId?`<span class="chip">Job ID ${esc(j.jobId)}</span>`:""}
    <span class="${m.cls}">📅 ${esc(m.txt)}</span>${m.s.target&&!m.s.paused?`<span class="chip">🎯 target ${esc(fmtShort(m.s.target))}</span>`:""}
    ${j.fileLocation?`<button class="chipbtn" onclick="openJobFile('${j.id}')">📁 Open file</button>`:""}
    ${j.materialListLoc?`<button class="chipbtn" onclick="openMatList('${j.id}')">📋 Material list</button>`:""}`;
  const head=`<button class="backbtn" onclick="go('jobs')">← Back to Jobs</button>
    <div class="dhead">
      <div class="dtoprow"><div class="dt">${esc(j.jobName)}</div><button class="btn sm" onclick="openForm('${j.id}','jobs')">Edit job</button></div>
      <div class="dmeta">${meta}</div>
      ${phaseStepper(j)}
      <div class="phacts">${phaseActions(j)}${isClosed(j)?"":`<button class="btn sm" onclick="toggleHold('${j.id}')">${oh?"▶ Resume (restart clock)":"⏸ Put on hold"}</button>`}</div>
      ${oh?`<div class="holdbanner">⏸ <b>On hold</b> since ${esc(fmtShort(oh.start))} — ${holdDays(oh)} working day${holdDays(oh)===1?"":"s"} so far${oh.reason?" · "+esc(oh.reason):""}. The clock is paused and the due date moves out by every working day held.</div>`:""}
      <div class="dprog"><span>Progress</span><span class="track"><span class="f" style="width:${Math.min(100,Math.max(0,+j.percent||0))}%"></span></span><span>${(+j.percent||0)}%</span></div>
    </div>`;

  const ups=(j.updates||[]).map((u,i)=>({u,i})).sort((a,b)=>{const d=(b.u.date||"").localeCompare(a.u.date||"");if(d)return d;return ((b.u.ts||0)-(a.u.ts||0))||(b.i-a.i);}).map(x=>x.u);
  const tops=topTasks(j.id);
  const procRfqs=(DB.procurement||[]).filter(r=>r.jobRef===j.id);
  const matRows=(DB.materials||[]).filter(x=>x.jobRef===j.id);
  const chkRows=(DB.checklists||[]).filter(x=>x.jobRef===j.id);
  const chkDone=chkRows.filter(r=>r.status==="Pass"||r.status==="N/A").length;
  const presetJob=JSON.stringify({jobRef:j.id});
  const sf=SCHEMA.jobs.fields;
  const factCell=k=>quickCell(sf.find(f=>f.k===k),j,"jobs");

  const overview=`<div class="ovgrid">
      <div class="ovfact"><label>Client</label><div>${j.client?esc(j.client):"—"}</div></div>
      <div class="ovfact"><label>Stage</label><div>${factCell("stage")}</div></div>
      <div class="ovfact"><label>Phase</label><div>${factCell("phase")}</div></div>
      <div class="ovfact"><label>Priority</label><div>${factCell("priority")}</div></div>
      <div class="ovfact"><label>${esc(m.s.label||"Status")}</label><div class="${m.cls}">${esc(m.txt)}${m.s.due?`<div style="font-size:11.5px;color:var(--ink-soft);font-weight:500">${esc(fmtDate(m.s.due))}${m.s.ext?" (+"+m.s.ext+" wd held)":""}</div>`:""}</div></div>
      ${m.s.target?`<div class="ovfact"><label>Target (min lead)</label><div>${esc(fmtDate(m.s.target))}</div></div>`:""}
    </div>
    <div class="ovbars"><div class="dprog wide"><span>Progress</span><span class="track"><span class="f" style="width:${Math.min(100,Math.max(0,+j.percent||0))}%"></span></span><span>${(+j.percent||0)}%</span></div></div>
    ${jobNeedsChecklist(j)?`<div class="nudge click" onclick="setDetailTab('checklist')">⚠️ This job is in <b>${esc(j.stage)}</b> but has no QC checklist — click to add one.</div>`:""}
    <div class="ovcounts">
      <button class="ovcount" onclick="setDetailTab('checklist')"><b>${chkDone}/${chkRows.length}</b><span>Checklist</span></button>
      <button class="ovcount" onclick="setDetailTab('schedule')"><b>${tops.length}</b><span>Tasks</span></button>
      <button class="ovcount" onclick="setDetailTab('materials')"><b>${matRows.length}</b><span>Materials</span></button>
      <button class="ovcount" onclick="setDetailTab('procurement')"><b>${procRfqs.length}</b><span>Supplier RFQs</span></button>
    </div>
    ${jobTimeline(j)}
    ${j.notes?`<div class="dsection"><h3><span class="ic">🗒️</span> Notes</h3><div class="dnotes">${esc(j.notes).replace(/\n/g,"<br>")}</div></div>`:""}
    <div class="dsection"><h3><span class="ic">📝</span> Latest updates <button class="btn sm" onclick="setDetailTab('updates')">View all</button></h3>
      ${ups.length?ups.slice(0,3).map(u=>`<div class="upditem"><span class="ud">${esc(fmtShort(u.date))}</span><span class="ut">${esc(u.text)}</span></div>`).join(""):`<div class="minimsg">No updates yet.</div>`}</div>`;

  const upHtml=ups.length?ups.map(u=>`<div class="upditem"><span class="ud">${esc(fmtShort(u.date))}</span><span class="ut">${esc(u.text)}</span><button class="ux" title="Delete" onclick="delUpdate('${j.id}','${u.id}')">×</button></div>`).join(""):`<div class="minimsg">No updates yet. Add the first one above.</div>`;
  const updates=`<div class="dsection"><h3><span class="ic">📝</span> Updates log</h3>
    <div class="updbox"><textarea id="updtext" placeholder="Type an update… (e.g. Sent follow-up RFQ to Supplier A)"></textarea><button class="btn primary" onclick="postUpdate('${j.id}')">Post</button></div>
    <div class="updlist">${upHtml}</div></div>`;

  let tree=tops.length?`<div class="tasktree">`+tops.map(t=>{
    const pct=taskPct(t),kids=taskKids(t.id);
    return taskNode(t,false,pct)+kids.map(s=>taskNode(s,true,+s.percent||0)).join("")+`<button class="miniadd sub" onclick="addSubtask('${j.id}','${t.id}')">+ Add subtask under “${esc(t.taskName.slice(0,26))}”</button>`;
  }).join("")+`</div>`:`<div class="minimsg">No tasks yet for this job.</div>`;
  const miniGantt=ganttSVG(j.id,{labelW:230});
  const schedule=`<div class="dsection"><h3><span class="ic">🗓️</span> Schedule / WBS <button class="btn sm add" onclick="addTask('${j.id}')">+ Add task</button></h3>
    ${tree}<button class="miniadd" onclick="addTask('${j.id}')">+ Add task</button>
    ${miniGantt?`<div style="margin-top:14px"><div class="gantt mini">${miniGantt}</div>${GANTT_LEGEND}</div>`:`<div class="minimsg" style="margin-top:8px">Add start &amp; end dates to tasks to see them on the timeline.</div>`}</div>`;

  const procurement=`<div class="dsection"><h3><span class="ic">📦</span> Procurement / RFQs <button class="btn sm add" onclick='openForm(null,"procurement",${presetJob})'>+ New RFQ</button></h3>${procRfqs.length?procRfqs.map(rfqCard).join(""):`<div class="minimsg">No RFQs for this job yet.</div>`}</div>`;

  let matBody;
  if(matRows.length){
    const cols=["materialId","description","qtyOnHand","thickness","length","mtr"];
    const ths=cols.map(k=>`<th>${SCHEMA.materials.fields.find(f=>f.k===k).l}</th>`).join("")+"<th></th>";
    const trs=matRows.map(r=>`<tr>${cols.map(k=>`<td>${cellHTML(SCHEMA.materials.fields.find(f=>f.k===k),r)}</td>`).join("")}<td><div class="rowact"><button class="icobtn" onclick='openForm("${r.id}","materials")'>✏️</button><button class="icobtn del" onclick='del("${r.id}","materials")'>🗑</button></div></td></tr>`).join("");
    matBody=`<div class="tablewrap"><table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
  }else matBody=`<div class="minimsg">No materials linked yet. Add one or import your material list CSV.</div>`;
  const materials=`<div class="dsection"><h3><span class="ic">🔩</span> Materials <span class="hbtns"><button class="btn sm" onclick="triggerMatCSV('${j.id}')">⤓ Import CSV</button><button class="btn sm" onclick='openForm(null,"materials",${presetJob})'>+ Add</button></span></h3>${matBody}<div style="margin-top:8px;font-size:11.5px;color:var(--ink-soft)">CSV columns recognised: Material ID, Description, Qty on Hand, Thickness, Length.</div></div>`;

  const tplOpts=(DB.meta.checklistTemplates||[]).map(t=>`<option>${esc(t.type)}</option>`).join("");
  const applyRow=`<div class="applytpl"><span class="lbl">Apply template</span><select id="apply-tpl"><option value="">Choose process…</option>${tplOpts}</select><button class="btn sm primary" onclick="applyTemplate('${j.id}')">Apply</button><span class="applyhint">auto-adds the standard QC checks for that process</span></div>`;
  let chkBody;
  if(chkRows.length){
    const cols=["item","type","status","inspector","startDate","date","signedBy"];
    const ths=cols.map(k=>`<th>${SCHEMA.checklists.fields.find(f=>f.k===k).l}</th>`).join("")+"<th>Duration</th><th></th>";
    const trs=chkRows.map(r=>{const dur=durationDays(r.startDate,r.date);return `<tr>${cols.map(k=>k==="status"?`<td>${quickCell(SCHEMA.checklists.fields.find(f=>f.k==="status"),r,"checklists")}</td>`:`<td>${cellHTML(SCHEMA.checklists.fields.find(f=>f.k===k),r)}</td>`).join("")}<td>${dur||"—"}</td><td><div class="rowact"><button class="icobtn" onclick='openForm("${r.id}","checklists")'>✏️</button><button class="icobtn del" onclick='del("${r.id}","checklists")'>🗑</button></div></td></tr>`;}).join("");
    chkBody=`<div class="tablewrap"><table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
  }else chkBody=`<div class="nudge">⚠️ No QC checklist yet. QC is non-negotiable — apply a template above (Welding, Fabrication, Sandblasting, Painting) to auto-add the standard checks, or add items manually.</div>`;
  const checklist=`<div class="dsection"><h3><span class="ic">✓</span> Checklist / QC ${chkRows.length?`<span class="chkprog">${chkDone}/${chkRows.length} signed off</span>`:""} <button class="btn sm add" onclick='openForm(null,"checklists",${presetJob})'>+ Add item</button></h3>${applyRow}${chkBody}</div>`;

  const sections={overview,checklist,schedule,materials,procurement,updates};
  const tabs=[["overview","Overview","📋",0],["checklist","Checklist","✓",chkRows.length],["schedule","Schedule","🗓️",tops.length],["materials","Materials","🔩",matRows.length],["procurement","Procurement","📦",procRfqs.length],["updates","Updates","📝",ups.length]];
  if(!sections[detailTab])detailTab="overview";
  const tabbar=`<div class="jtabs">`+tabs.map(([id,label,ic,cnt])=>`<button class="${detailTab===id?'active':''}" onclick="setDetailTab('${id}')">${ic} ${label}${cnt?`<span class="tabcnt">${cnt}</span>`:""}</button>`).join("")+`</div>`;

  document.getElementById("content").innerHTML=head+tabbar+`<div class="jbody">${sections[detailTab]}</div>`;
}
function taskNode(t,sub,pct){
  const sp=taskSpan(t);
  const dates=(sp.start||sp.end)?`${fmtShort(sp.start)} – ${fmtShort(sp.end)}`:"no dates";
  const done=t.status==="Done";
  const ms=t.milestone?`<span class="badge" style="background:var(--weld-soft);color:var(--weld)">◆</span>`:"";
  return `<div class="tnode ${sub?'sub':''}">
    <span class="tn ${done?'done':''}">${esc(t.taskName)}</span>
    ${ms}<span class="badge ${badgeClass(t.status)}">${esc(t.status)}</span>
    <span class="spacer"></span><span class="tdates">${esc(dates)}</span><span class="tpct">${pct}%</span>
    <span class="tacts rowact"><button class="icobtn" title="Edit" onclick="openForm('${t.id}','tasks')">✏️</button><button class="icobtn del" title="Delete" onclick="del('${t.id}','tasks')">🗑</button></span>
  </div>`;
}
function postUpdate(jobId){const el=document.getElementById("updtext"),txt=el.value.trim();if(!txt){el.focus();return;}const j=DB.jobs.find(x=>x.id===jobId);(j.updates=j.updates||[]).push({id:uid(),date:todayISO(),ts:Date.now(),text:txt});save();renderDetail();toast("Update posted");}
function delUpdate(jobId,upId){const j=DB.jobs.find(x=>x.id===jobId);j.updates=(j.updates||[]).filter(u=>u.id!==upId);save();renderDetail();}
function addTask(jobId){ openForm(null,"tasks",{jobRef:jobId}); }
function addSubtask(jobId,parentId){ openForm(null,"tasks",{jobRef:jobId,parentTask:parentId}); }

/* ============ OPEN FILE ============ */
function openJobFile(id){const j=DB.jobs.find(x=>x.id===id);openFile(j&&j.fileLocation);}
function openMatList(id){const j=DB.jobs.find(x=>x.id===id);openFile(j&&j.materialListLoc);}
function openFile(path){
  if(!path||!path.trim()){toast("No file location set — add one via Edit job");return;}
  let p=path.trim();
  if(/^https?:\/\//i.test(p)){window.open(p,"_blank");return;}
  let url=p.replace(/\\/g,"/");
  if(/^[a-zA-Z]:\//.test(url))url="file:///"+url;
  else if(/^\/\//.test(p))url="file://"+url;
  else if(url.startsWith("/"))url="file://"+url;
  else url="file:///"+url;
  let win=null; try{win=window.open(url,"_blank");}catch(e){win=null;}
  copyText(p, win?"Trying to open… if your browser blocked it, the path is now copied — paste it into your file explorer.":"Path copied — paste it into your file explorer's address bar to open.");
}
function copyText(t,msg){ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast(msg),()=>fallbackCopy(t,msg));} else fallbackCopy(t,msg); }
function fallbackCopy(t,msg){ try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);toast(msg);}catch(e){toast("Path: "+t);} }

/* ============ MATERIAL CSV IMPORT ============ */
function triggerMatCSV(jobId){
  const inp=document.getElementById("matcsv");
  inp.onchange=e=>importMaterialsCSV(e,jobId);
  inp.value=""; inp.click();
}
function parseCSV(text){
  const rows=[];let i=0,field="",row=[],inQ=false;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i<text.length){
    const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue;} field+=ch;i++;continue; }
    if(ch==='"'){inQ=true;i++;continue;}
    if(ch===","){row.push(field);field="";i++;continue;}
    if(ch==="\n"){row.push(field);rows.push(row);row=[];field="";i++;continue;}
    field+=ch;i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function importMaterialsCSV(e,jobId){
  const file=e.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=parseCSV(rd.result);
      if(rows.length<2){toast("CSV needs a header row plus at least one data row");return;}
      const hdr=rows[0].map(h=>h.trim().toLowerCase());
      const find=(...names)=>{for(const n of names){const idx=hdr.indexOf(n);if(idx>=0)return idx;}return -1;};
      const ci={id:find("material id","mat id","id","item no","item #","item"),desc:find("description","desc","material","material description"),qty:find("qty on hand","quantity on hand","qty","quantity"),thk:find("thickness","thk"),len:find("length","len")};
      let n=0;
      rows.slice(1).forEach(r=>{
        const get=k=>ci[k]>=0?(r[ci[k]]||"").trim():"";
        const id=get("id"),desc=get("desc");
        if(!id&&!desc)return;
        DB.materials.push({id:uid(),materialId:id,description:desc,thickness:Number(get("thk"))||0,length:Number(get("len"))||0,qtyOnHand:Number(get("qty"))||0,receivedFromRef:"",mtr:false,jobRef:jobId,jobDone:false});
        n++;
      });
      save();renderDetail();buildNav();toast(n+" material"+(n===1?"":"s")+" imported");
    }catch(err){toast("Could not read that CSV file");}
  };
  rd.readAsText(file);
}

/* ============ FORM ============ */
function openForm(id,table,preset){
  formMode="record"; formTable=table||current; editingId=id||null;
  const sch=SCHEMA[formTable];
  let rec=id?DB[formTable].find(r=>r.id===id):Object.assign({},preset||{});
  if(!id&&formTable==="jobs")rec=Object.assign({phase:PH.RFQ,rfqDate:todayISO(),leadUnit:"working days"},rec);
  document.getElementById("mtitle").textContent=(id?"Edit ":"Add ")+sch.label.replace(/s$/,"");
  document.getElementById("mbody").innerHTML=sch.fields.map(f=>fieldHTML(f,rec)).join("");
  document.getElementById("scrim").classList.add("show");
  const first=document.querySelector("#mbody [data-k]");if(first&&first.focus)setTimeout(()=>first.focus(),30);
}
function fieldHTML(f,rec){
  if(f.t==="heading")return `<div class="fhead">${esc(f.l)}</div>`;
  const v=rec[f.k],full=(f.full||f.t==="textarea")?"full":"";
  let inner="";
  if(f.t==="textarea")inner=`<textarea data-k="${f.k}">${esc(v||"")}</textarea>`;
  else if(f.t==="select"){
    if(f.dyn){
      let opts=optsFor(f).slice();
      if(v&&!opts.includes(v))opts.unshift(v);
      const addOpt=f.dyn==="clients"?`<option value="__add__">➕ Add new client…</option>`:"";
      const oc=f.dyn==="clients"?` onchange="clientSel(this)"`:"";
      const dp=f.dyn==="clients"?` data-prev="${esc(v||"")}"`:"";
      inner=`<select data-k="${f.k}"${dp}${oc}><option value=""></option>${opts.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}${addOpt}</select>`;
    } else inner=`<select data-k="${f.k}"><option value=""></option>${f.opts.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  }
  else if(f.t==="link"){
    let list=DB[f.to]||[];
    if(formTable==="tasks"&&f.k==="parentTask")list=list.filter(r=>r.id!==editingId&&!r.parentTask);
    const o=list.map(r=>`<option value="${r.id}" ${v===r.id?"selected":""}>${esc(r[SCHEMA[f.to].primary]||"(untitled)")}</option>`).join("");
    inner=`<select data-k="${f.k}"><option value="">— none —</option>${o}</select>`;
  }
  else if(f.t==="checkbox")inner=`<div class="cbwrap"><input type="checkbox" data-k="${f.k}" ${v?"checked":""}><span style="font-size:12px;color:var(--ink-soft)">Yes</span></div>`;
  else if(f.t==="multiselect")inner=`<div class="msetwrap" data-k="${f.k}" data-mset="1">${f.opts.map(o=>`<label><input type="checkbox" value="${o}" ${(v||[]).includes(o)?"checked":""}>${o}</label>`).join("")}</div>`;
  else if(f.t==="date")inner=`<input type="date" data-k="${f.k}" value="${esc(v||"")}">`;
  else if(f.t==="number")inner=`<input type="number" step="any" data-k="${f.k}" value="${v??""}">`;
  else inner=`<input type="text" data-k="${f.k}" value="${esc(v||"")}">`;
  return `<div class="field ${full}"><label>${f.l}${f.req?' <span style="color:var(--bad)">*</span>':''}</label>${inner}</div>`;
}
function clientSel(sel){
  if(sel.value!=="__add__"){sel.dataset.prev=sel.value;return;}
  const name=(prompt("New client name:")||"").trim();
  if(name){
    DB.meta=DB.meta||{clients:[]};
    if(!DB.meta.clients.some(c=>c.toLowerCase()===name.toLowerCase())){DB.meta.clients.push(name);DB.meta.clients.sort((a,b)=>a.localeCompare(b));save();}
    sel.innerHTML=`<option value=""></option>`+DB.meta.clients.map(o=>`<option>${esc(o)}</option>`).join("")+`<option value="__add__">➕ Add new client…</option>`;
    sel.value=name;sel.dataset.prev=name;toast("Client “"+name+"” added");
  } else sel.value=sel.dataset.prev||"";
}
function saveForm(){
  if(formMode==="line")return saveLine();
  if(formMode==="phase")return savePhase();
  const sch=SCHEMA[formTable],rec=editingId?DB[formTable].find(r=>r.id===editingId):{id:uid()};
  const oldPhase=editingId?rec.phase:null;
  let firstReq=null;
  document.querySelectorAll("#mbody [data-k]").forEach(el=>{
    const k=el.dataset.k,f=sch.fields.find(x=>x.k===k);
    if(el.dataset.mset)rec[k]=Array.from(el.querySelectorAll("input:checked")).map(i=>i.value);
    else if(el.type==="checkbox")rec[k]=el.checked;
    else if(f.t==="number")rec[k]=el.value===""?"":Number(el.value);
    else rec[k]=el.value;
    if(f.req&&!rec[k]&&firstReq===null)firstReq=el;
  });
  if(firstReq){firstReq.focus();toast("Please fill the required field");return;}
  if(formTable==="jobs"){
    if(!Array.isArray(rec.updates))rec.updates=[];if(rec.materialListLoc===undefined)rec.materialListLoc="";
    if(!Array.isArray(rec.holds))rec.holds=[];if(!Array.isArray(rec.phaseLog))rec.phaseLog=[];
    const np=rec.phase||PH.RFQ;
    if(!editingId){rec.phase=np;rec.phaseLog.push({phase:np,from:"",date:rec.rfqDate||todayISO(),ts:Date.now()});}
    else if(np!==oldPhase){rec.phase=oldPhase;setPhase(rec,np);}
  }
  if(formTable==="procurement"&&!Array.isArray(rec.suppliers))rec.suppliers=[];
  if(!editingId)DB[formTable].push(rec);
  save();closeForm();rerender();toast(editingId?"Saved":"Added");
}
function closeForm(){document.getElementById("scrim").classList.remove("show");editingId=null;formMode="record";lineCtx=null;phaseCtx=null;}
function del(id,table){
  const tbl=table||current,sch=SCHEMA[tbl],r=DB[tbl].find(x=>x.id===id);
  let extra="";
  if(tbl==="tasks"&&taskKids(id).length)extra=" Its subtasks will also be deleted.";
  if(tbl==="jobs")extra=" Linked records will keep their reference but the job will be gone.";
  if(!confirm(`Delete "${r[sch.primary]||'this record'}"? This cannot be undone.${extra}`))return;
  DB[tbl]=DB[tbl].filter(x=>x.id!==id);
  if(tbl==="tasks")DB.tasks=DB.tasks.filter(x=>x.parentTask!==id);
  if(tbl==="jobs"&&detailJob===id){detailJob=null;go("jobs");toast("Deleted");return;}
  save();rerender();toast("Deleted");
}

/* ============ BACKUP / RESTORE / CSV ============ */
/* ============ SAVE LOCATION (Chrome/Edge: save into a chosen folder) ============ */
let saveDir=null;                              // FileSystemDirectoryHandle
const FS_OK=(typeof window!=="undefined"&&"showDirectoryPicker" in window);
function idb(){ return new Promise((res,rej)=>{const r=indexedDB.open("protrac_fs",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}); }
async function idbSet(k,v){ try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){} }
async function idbGet(k){ try{const db=await idb();return await new Promise((res,rej)=>{const t=db.transaction("kv","readonly");const rq=t.objectStore("kv").get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});}catch(e){return null;} }
async function loadSaveDir(){ if(!FS_OK)return; const h=await idbGet("dir"); if(h){saveDir=h;updFolderBtn();} }
function updFolderBtn(){ const el=document.getElementById("folderlbl"); if(!el)return; el.textContent=saveDir?saveDir.name:"Set save folder"; const b=document.getElementById("folderbtn"); if(b)b.title=saveDir?("Backups & CSVs save into: "+saveDir.name+" — click to change"):"Pick a folder once (e.g. Documents\\Tracker) so files don't pile up in Downloads"; }
async function chooseSaveFolder(){
  if(!FS_OK){toast("Folder saving needs Chrome or Edge. Other browsers save to Downloads.");return;}
  try{
    const h=await window.showDirectoryPicker({id:"protrac",mode:"readwrite",startIn:"documents"});
    saveDir=h; await idbSet("dir",h); updFolderBtn(); toast("Saving into “"+h.name+"” from now on");
  }catch(e){ if(e&&e.name!=="AbortError")toast("Could not set that folder"); }
}
async function ensureDirPerm(){
  if(!saveDir)return false;
  try{
    const opt={mode:"readwrite"};
    if((await saveDir.queryPermission(opt))==="granted")return true;
    if((await saveDir.requestPermission(opt))==="granted")return true;
  }catch(e){}
  return false;
}
async function saveFile(filename,blob,okMsg){
  if(saveDir&&await ensureDirPerm()){
    try{
      const fh=await saveDir.getFileHandle(filename,{create:true});
      const w=await fh.createWritable(); await w.write(blob); await w.close();
      toast((okMsg||"Saved")+" → "+saveDir.name+"\\"+filename); return;
    }catch(e){}
  }
  if(FS_OK){
    try{
      const fh=await window.showSaveFilePicker({suggestedName:filename,startIn:"documents"});
      const w=await fh.createWritable(); await w.write(blob); await w.close();
      toast(okMsg||"Saved"); return;
    }catch(e){ if(e&&e.name==="AbortError")return; }
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
  toast((okMsg||"Saved")+" (Downloads folder)");
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  saveFile("Protrac_backup_"+todayISO()+".json",blob,"Backup saved");
}
function importBackup(e){
  const file=e.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const data=JSON.parse(rd.result);if(!TABLES.every(t=>Array.isArray(data[t])))throw 0;if(!confirm("Restore this backup? It will replace ALL current data.")){e.target.value="";return;}DB=data;migrate();save();detailJob=null;go("jobs");toast("Backup restored");}catch(err){toast("That file isn't a valid Protrac backup");}e.target.value="";};
  rd.readAsText(file);
}
function exportCSV(){
  if(current==="procurement"){
    const rows=[];
    (DB.procurement||[]).forEach(r=>{
      const base=[r.rfqNumber,r.date,refName("jobs",r.jobRef),r.item,r.qtyRequested];
      if((r.suppliers||[]).length)r.suppliers.forEach(s=>rows.push(base.concat([refName("suppliers",s.supplierRef),s.status,s.dateSent,lineWait(s)??"",s.eta,s.awarded?"Yes":"No",s.notes])));
      else rows.push(base.concat(["","","","","","",""]));
    });
    const head=["RFQ Number","Date","Job","Items Requested","Qty Requested","Supplier","Status","Date Sent","Days Waiting","ETA","Awarded","Line Notes"];
    csvDownload(head,rows,"procurement");return;
  }
  const sch=SCHEMA[current],data=DB[current]||[];
  if(!data.length){toast("Nothing to export");return;}
  const cols=sch.fields.filter(f=>f.t!=="heading");
  const head=cols.map(f=>f.l);
  const rows=data.map(r=>cols.map(f=>{let v=r[f.k];if(f.t==="link")v=refName(f.to,v);else if(Array.isArray(v))v=v.join("; ");else if(f.t==="checkbox")v=v?"Yes":"No";return v;}));
  if(current==="jobs"){head.push("Due date","Due / next action");rows.forEach((row,i)=>{const s=jobState(data[i]);row.push(s.due||s.followUp||"",jobDueMeta(data[i]).txt);});}
  csvDownload(head,rows,current);
}
function csvDownload(head,rows,name){
  const q=v=>'"'+(v??"").toString().replace(/"/g,'""')+'"';
  const csv=head.map(q).join(",")+"\n"+rows.map(r=>r.map(q).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv"});
  saveFile("Protrac_"+name+"_"+todayISO()+".csv",blob,"CSV saved");
}
function clearAll(){ if(!confirm("Erase ALL data and reset to the starter examples? Export a backup first if you want to keep anything."))return; DB=seed();migrate();save();detailJob=null;go("dashboard");toast("Reset to starter data"); }

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeForm();});
initTheme();load();buildNav();render();loadSaveDir();
